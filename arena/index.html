<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nörti Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../app/style.css">
<style>
  :root { --beer: #F2A516; --beer-d: #C97F06; --foam: #FFFDF5; --lp: #2E9E58; --lp-mid: #E8B321; --lp-low: #D9442B; }
  h1, h2 { margin: 0; font-family: var(--disp); font-weight: 400; line-height: 1.05; }
  h1 { font-size: 32px; } h2 { font-size: 22px; }
  .sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sizes button { font: 500 15px var(--body); border: 2px solid var(--ink); border-radius: 12px; background: var(--white); color: var(--ink); min-height: 46px; cursor: pointer; }
  .sizes button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  .team { display: flex; flex-direction: column; gap: 10px; }
  .team-name { font: 400 20px var(--disp); border: 0; border-bottom: 2px dashed var(--dot); background: transparent; color: var(--ink); padding: 2px 0; width: 100%; }
  .team-name:focus { outline: none; border-bottom-color: var(--ink); }
  .slot { display: flex; align-items: center; gap: 10px; background: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 8px; min-height: 64px; }
  .slot.empty { border-style: dashed; justify-content: center; color: var(--muted); cursor: pointer; font: 500 15px var(--body); background: transparent; width: 100%; }
  .thumb { width: 48px; height: 48px; border-radius: 10px; border: 2px solid var(--ink); overflow: hidden; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font: 400 14px var(--disp); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .slot .who { flex: 1; min-width: 0; }
  .slot .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { border: 0; background: none; font-size: 22px; width: 44px; height: 44px; cursor: pointer; color: var(--ink); }
  .warn { color: var(--err); font-size: 13px; }
  .vs { text-align: center; font: 400 20px var(--disp); }
  .pick-list { display: flex; flex-direction: column; gap: 8px; }
  .pick-list button { display: flex; align-items: center; gap: 10px; text-align: left; font: 15px var(--body); border: 2px solid var(--ink); border-radius: 12px; background: var(--white); padding: 8px; cursor: pointer; color: var(--ink); min-height: 56px; }

  /* Kampf */
  .fighter { background: var(--white); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  .fighter.big { border-width: 3px; box-shadow: 5px 5px 0 var(--ink); }
  .fighter .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .fighter .nm { display: flex; gap: 6px; align-items: baseline; }
  .fighter .nm b { font: 400 18px var(--disp); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fighter.big .nm b { font-size: 22px; }
  .fighter .team-l { font-size: 12px; color: var(--muted); }
  .fighter.ko { opacity: .55; }
  .lpbar { height: 12px; border: 2px solid var(--ink); border-radius: 7px; background: var(--white); overflow: hidden; }
  .lpbar > div { height: 100%; transition: width .5s ease, background-color .5s; }
  .lptext { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bench { display: flex; gap: 4px; }
  .bench span { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); background: var(--lp); }
  .bench span.ko { background: var(--white); }
  .mug { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; font: 400 13px var(--disp); }
  .mug svg { display: block; }
  .mug .liq { transition: y .5s ease, height .5s ease; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badges span { font-size: 11px; font-weight: 700; border: 1.5px solid var(--ink); border-radius: 99px; padding: 0 8px; background: var(--marker); }
  .badges span.bad { background: #FBD4CC; }
  .actlist { display: flex; flex-direction: column; gap: 8px; }
  .act { font: 15px var(--body); color: var(--ink); text-align: left; background: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 52px; }
  .act b { font: 400 17px var(--disp); }
  .act .d { font-size: 13px; color: var(--muted); }
  .act[aria-pressed="true"] { background: var(--marker); box-shadow: 4px 4px 0 var(--ink); }
  .act:disabled { opacity: .45; cursor: default; }
  .act-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .round { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .round .disp { font-size: 15px; }
  .peek { font-size: 13px; background: var(--ink); color: var(--white); border-radius: 10px; padding: 6px 10px; text-align: center; }
  .hand { text-align: center; padding: 40px 10px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .hand .big { font-size: 64px; line-height: 1; }
  .reveal { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
  .choice { background: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; animation: flip .45s ease both; }
  .choice b { font: 400 16px var(--disp); }
  .choice .d { font-size: 12px; color: var(--muted); }
  .choice:nth-child(3) { animation-delay: .2s; }
  @keyframes flip { from { transform: rotateY(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .log { display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
  .log p { margin: 0; font-size: 15px; padding: 6px 10px; background: var(--white); border-left: 4px solid var(--ink); border-radius: 4px; animation: pop .25s ease both; }
  .log p.A { border-left-color: var(--sound); } .log p.B { border-left-color: var(--street); }
  .log p.good { font-weight: 700; } .log p.end { background: var(--marker); font-weight: 700; }
  @keyframes pop { from { transform: translateY(4px); opacity: 0; } to { transform: none; opacity: 1; } }
  .dice-wrap { display: flex; align-items: center; gap: 14px; justify-content: center; padding: 6px; min-height: 104px; }
  .d20 { width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; font: 400 34px var(--disp); color: var(--ink); position: relative; }
  .d20::before { content: ""; position: absolute; inset: 0; background: var(--ink); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
  .d20::after { content: ""; position: absolute; inset: 4px; background: var(--white); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
  .d20 span { position: relative; z-index: 1; }
  .d20.ok::after { background: #BDEBCB; } .d20.fail::after { background: #FBD4CC; }
  .d20.spin { animation: wob .12s linear infinite; }
  @keyframes wob { 0% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }
  .dice-txt { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
  .dice-txt b { font: 400 18px var(--disp); }
  .sticky { position: sticky; bottom: 0; padding: 10px 0 calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--paper) 30%); }
  .win { text-align: center; padding: 18px 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .win .crown { font-size: 56px; line-height: 1; }
  /* Kampfbühne: Gegner oben rechts, eigene Figur unten links, Infokästen gegenüber */
  .stage { position: relative; height: 340px; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 5px 5px 0 var(--ink);
    background: radial-gradient(var(--dot) 1.1px, transparent 1.1px) 0 0 / 16px 16px, linear-gradient(#F7F8FA 0 58%, #ECEEF1 58%); }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; top: 58%; border-top: 2px dashed var(--dot); }
  .ibox { position: absolute; z-index: 3; width: 57%; background: var(--white); border: 2.5px solid var(--ink); border-radius: 12px; padding: 5px 6px 5px 9px;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; box-shadow: 3px 3px 0 var(--ink); }
  .ibox.far { left: 8px; top: 8px; }
  .ibox.near { right: 8px; bottom: 8px; }
  .ibox .main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .ibox .nm { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .ibox .nm b { font: 400 15px var(--disp); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ibox .nm .lv { font-size: 11px; padding: 0 5px; white-space: nowrap; flex: 0 0 auto; }
  .ibox .hp { display: flex; align-items: center; gap: 5px; }
  .ibox .hp-l { font: 700 10px var(--body); background: var(--ink); color: var(--marker); border-radius: 4px; padding: 0 4px; }
  .ibox .lpbar { flex: 1; height: 10px; }
  .ibox .ib-row { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .ibox .ib-row .team-l { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }
  .ibox .badges { grid-column: 1 / -1; }
  .ibox .mug span { font-size: 12px; }
  .fig { position: absolute; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  .fig.far { right: 7%; top: 40px; }
  .fig.near { left: 6%; bottom: 34px; }
  .plat { position: absolute; bottom: -12px; width: 150%; height: 34px; border: 2px solid var(--ink); border-radius: 50%;
    background: repeating-linear-gradient(135deg, #F4F5F7 0 6px, #E2E5EA 6px 12px); z-index: -1; }
  .sprite { width: 92px; height: 92px; background: var(--white); border: 2.5px solid var(--ink); border-radius: 10px; padding: 5px; box-shadow: 4px 4px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(3deg); animation: bob 2.4s ease-in-out infinite; }
  .fig.near .sprite { width: 104px; height: 104px; transform: rotate(-3deg); animation-delay: -1.2s; }
  .sprite img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; }
  .sprite .sp-id { font: 400 32px var(--disp); line-height: 1; }
  .sprite .sp-n { font-size: 12px; color: var(--muted); text-align: center; }
  .sprite.noimg { background: repeating-linear-gradient(135deg, #FFFFFF 0 10px, #F1F2F5 10px 20px); }
  @keyframes bob { 50% { translate: 0 -4px; } }
  .bubble { position: absolute; top: -14px; z-index: 4; font: 700 12px var(--body); background: var(--marker); border: 2px solid var(--ink); border-radius: 99px; padding: 2px 9px; white-space: nowrap; animation: popin .35s ease both; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .fig.far .bubble { right: -6px; } .fig.near .bubble { left: -4px; }
  @keyframes popin { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Bewegungen */
  .fig.near .sprite.lunge { animation: lungeN .55s ease; }
  .fig.far .sprite.lunge { animation: lungeF .55s ease; }
  @keyframes lungeN { 40% { translate: 70px -60px; } }
  @keyframes lungeF { 40% { translate: -70px 60px; } }
  .sprite.hit { animation: hit .5s ease; }
  @keyframes hit { 0%,100% { translate: 0; filter: none; } 15% { translate: -8px 0; filter: sepia(1) saturate(6) hue-rotate(-40deg); } 30% { translate: 8px 0; } 45% { translate: -6px 0; filter: sepia(1) saturate(6) hue-rotate(-40deg); } 60% { translate: 5px 0; } }
  .fig.near .sprite.dodge { animation: dodgeN .6s ease; } .fig.far .sprite.dodge { animation: dodgeF .6s ease; }
  @keyframes dodgeN { 40% { translate: -40px 6px; opacity: .45; } }
  @keyframes dodgeF { 40% { translate: 40px -6px; opacity: .45; } }
  .sprite.guard { box-shadow: 0 0 0 5px var(--white), 0 0 0 8px var(--sound), 4px 4px 0 8px var(--ink); }
  .sprite.heal { animation: glow .8s ease; }
  @keyframes glow { 50% { box-shadow: 0 0 0 8px #BDEBCB, 4px 4px 0 8px var(--ink); } }
  .sprite.koed { animation: none; transform: rotate(80deg) translateY(18px); filter: grayscale(1); opacity: .5; transition: transform .6s ease, opacity .6s; }
  .sprite.out { transition: transform .35s ease, opacity .35s; opacity: 0; }
  .fig.near .sprite.out { transform: translateX(-160px); } .fig.far .sprite.out { transform: translateX(160px); }
  .float { position: absolute; z-index: 5; font: 400 26px var(--disp); pointer-events: none; animation: floatUp 1.1s ease-out both; white-space: nowrap; -webkit-text-stroke: 1px var(--ink); }
  .float.dmg { color: var(--lp-low); } .float.heal { color: var(--lp); } .float.beer { color: var(--beer); font-size: 20px; } .float.info { color: var(--ink); -webkit-text-stroke: 0; font: 700 13px var(--body); background: var(--marker); border: 2px solid var(--ink); border-radius: 99px; padding: 1px 8px; }
  @keyframes floatUp { from { transform: translateY(10px) scale(.6); opacity: 0; } 20% { transform: translateY(0) scale(1.15); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
  .fx { position: absolute; inset: 0; z-index: 6; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .stamp { position: absolute; font: 400 34px var(--disp); color: var(--white); background: var(--ink); padding: 4px 16px; border-radius: 10px; transform: rotate(-6deg); animation: stamp .9s ease both; box-shadow: 4px 4px 0 var(--marker); }
  .stamp.good { background: var(--lp); } .stamp.bad { background: var(--lp-low); } .stamp.gold { background: var(--marker); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  @keyframes stamp { 0% { transform: rotate(-6deg) scale(2.4); opacity: 0; } 25% { transform: rotate(-6deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: rotate(-6deg) scale(1); } }
  /* Würfel */
  .dicebox { background: var(--white); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); padding: 10px 12px; width: min(92%, 330px);
    display: flex; flex-direction: column; align-items: center; gap: 6px; animation: popin .25s ease both; }
  .dlabel { font: 700 13px var(--body); text-align: center; }
  .dlabel b { font: 400 17px var(--disp); display: block; }
  .die { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; }
  .die svg { position: absolute; inset: 0; }
  .die span { position: relative; font: 400 30px var(--disp); margin-top: 8px; }
  .die.roll svg { animation: tumble .5s linear infinite; }
  .die.roll { animation: hop .5s ease-in-out infinite; }
  @keyframes tumble { to { transform: rotate(360deg); } }
  @keyframes hop { 50% { transform: translateY(-14px) scale(1.05); } }
  .die.land { animation: land .35s ease; }
  @keyframes land { 0% { transform: scale(1.35); } 60% { transform: scale(.92); } }
  .die.ok .face { fill: #BDEBCB; } .die.fail .face { fill: #FBD4CC; }
  .strip { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; width: 100%; }
  .strip i { font: 700 9px var(--body); font-style: normal; text-align: center; padding: 3px 0; border-radius: 3px; background: #FBD4CC; color: #8a2a1c; border: 1.5px solid transparent; }
  .strip i.g { background: #BDEBCB; color: #155c32; }
  .strip i.cur { border-color: var(--ink); transform: scale(1.25); }
  .strip i.res { background: var(--ink); color: var(--white); transform: scale(1.35); }
  .dtext { font-size: 13px; text-align: center; }
  .dtext b { font-family: var(--disp); font-weight: 400; }
  /* Textkasten */
  .dialog { position: relative; background: var(--white); border: 3px solid var(--ink); border-radius: 14px; padding: 12px 34px 12px 14px; min-height: 72px;
    font: 500 17px/1.35 var(--body); box-shadow: inset 0 0 0 3px var(--white), inset 0 0 0 5px var(--dot); cursor: pointer; }
  .dialog .more { position: absolute; right: 12px; bottom: 8px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .menu { border: 3px solid var(--ink); border-radius: 14px; background: var(--white); padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .menu .act { border-width: 2px; }
  .menu-h { font: 700 12px var(--body); color: var(--muted); letter-spacing: .04em; padding: 0 4px; }
  .skip { font: 500 14px var(--body); background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 8px; align-self: center; min-height: 40px; }
  @media (prefers-reduced-motion: reduce) {
    .sprite, .fig .sprite.lunge, .sprite.hit, .fig .sprite.dodge, .die.roll, .die.roll svg, .die.land, .bubble, .float, .stamp, .dicebox { animation: none !important; }
    .dialog .more { animation: none; }
  }
  [hidden] { display: none !important; }
  .lvup { background: var(--marker); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; box-shadow: 3px 3px 0 var(--ink); animation: pop .4s ease both; }
  .lvup > b { font: 400 18px var(--disp); }
  @media (prefers-reduced-motion: reduce) { .choice, .log p { animation: none; } .d20.spin { animation: none; } .lpbar > div, .mug .liq { transition: none; } }

  /* ---------- Anschaulicher (2026-11-20): Teamfarben, Aktionskarten, Wer-schlägt-wen ---------- */
  :root { --tA: var(--sound); --tB: var(--street); --tA-l: #EDE6FD; --tB-l: #FDE9DC; --ok-l: #BDEBCB; --bad-l: #FBD4CC; }
  .tA { --tc: var(--tA); --tc-l: var(--tA-l); } .tB { --tc: var(--tB); --tc-l: var(--tB-l); }
  .tchip { display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--body); letter-spacing: .04em; color: var(--white); background: var(--tc); border: 2px solid var(--ink); border-radius: 99px; padding: 1px 10px; white-space: nowrap; }
  .sticky { pointer-events: none; } .sticky > * { pointer-events: auto; }
  /* Aufstellung */
  .steps { display: flex; gap: 6px; font: 700 12px var(--body); color: var(--muted); }
  .steps span { flex: 1; text-align: center; padding: 4px 2px; border-bottom: 3px solid var(--dot); }
  .steps span.done { color: var(--ink); border-bottom-color: var(--okc); }
  .steps span.now { color: var(--ink); border-bottom-color: var(--ink); }
  .team.card { border-top: 8px solid var(--tc); position: relative; }
  .team .tchip { align-self: flex-start; }
  .team .count { position: absolute; right: 12px; top: 10px; font: 700 13px var(--body); color: var(--muted); }
  .slot.empty { border-color: var(--tc); color: var(--ink); background: var(--tc-l); }
  .todo { font-size: 13px; text-align: center; color: var(--muted); margin: 0; background: var(--white); border: 2px solid var(--ink); border-radius: 10px; padding: 5px 10px; }
  .todo b { color: var(--ink); }
  /* Übergabe */
  .hand { background: var(--tc-l); border-top: 10px solid var(--tc); }
  .hand .avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--tc); color: var(--white); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    display: flex; align-items: center; justify-content: center; font: 400 40px var(--disp); }
  .hand .btn-main { background: var(--tc); color: var(--white); }
  .roundbar { display: flex; flex-direction: column; gap: 4px; }
  .roundbar .bar { height: 8px; } .roundbar .bar > div { background: var(--ink); }
  /* Infokasten mit Teamfarbe */
  .ibox { border-left: 7px solid var(--tc); }
  /* kompakte Bühne beim Wählen */
  .stage.compact { height: 236px; } .stage.mid { height: 286px; }
  .stage.mid .fig.far { top: 30px; } .stage.mid .fig.near { bottom: 28px; }
  .stage.compact .fig.far { top: 24px; right: 8%; } .stage.compact .fig.near { bottom: 22px; }
  .stage.compact .sprite { width: 70px; height: 70px; } .stage.compact .fig.near .sprite { width: 80px; height: 80px; }
  .stage.compact .sprite .sp-id { font-size: 24px; } .stage.compact .sprite .sp-n { font-size: 10px; }
  .stage.compact .plat { height: 26px; bottom: -10px; }
  /* Wählen */
  .pickhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .help { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: var(--white); font: 400 18px var(--disp); cursor: pointer; color: var(--ink); flex: 0 0 auto; }
  .tank { display: flex; align-items: center; gap: 10px; background: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; font-size: 14px; }
  .tank .meter { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 7px; background: var(--white); overflow: hidden; position: relative; }
  .tank .meter i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--beer); transition: width .3s ease; }
  .tank .meter i.cost { background: repeating-linear-gradient(135deg, var(--beer) 0 4px, var(--foam) 4px 8px); }
  .tank .mug span { display: none; }
  .cost small { font-size: 14px; }
  .tank b { font: 400 16px var(--disp); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sec-h { font: 700 12px var(--body); color: var(--muted); letter-spacing: .05em; margin: 2px 2px -4px; display: flex; justify-content: space-between; }
  .acard { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; font: 15px var(--body); color: var(--ink);
    background: var(--white); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px 8px 8px; cursor: pointer; min-height: 64px; position: relative; }
  .acard[aria-pressed="true"] { background: var(--marker); border-width: 3px; box-shadow: 4px 4px 0 var(--ink); transform: translate(-2px, -2px); }
  .acard:disabled { cursor: default; background: #F1F2F5; color: var(--muted); }
  .acard:disabled .big, .acard:disabled .cost { opacity: .45; }
  .acard .big { height: 48px; border-radius: 10px; background: var(--ink); color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .acard .big b { font: 400 21px var(--disp); }
  .acard .big small { font: 700 9px var(--body); letter-spacing: .05em; margin-top: 3px; color: var(--marker); }
  .acard .big.heal { background: var(--lp); } .acard .big.heal small { color: var(--white); }
  .acard .big.fx { background: var(--sound); } .acard .big.fx small { color: var(--white); }
  .acard .mid { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .acard .mid > b { font: 400 17px var(--disp); line-height: 1.1; }
  .acard .extra { font-size: 12px; color: var(--muted); }
  .acard .why { font-size: 12px; font-weight: 700; color: var(--err); }
  .hitbar { display: flex; align-items: center; gap: 6px; font: 700 12px var(--body); font-variant-numeric: tabular-nums; }
  .hitbar .segs { flex: 1; display: grid; grid-template-columns: repeat(20, 1fr); gap: 1px; max-width: 150px; }
  .hitbar .segs i { height: 8px; border-radius: 2px; background: var(--bad-l); }
  .hitbar .segs i.g { background: var(--okc); }
  .cost { display: flex; flex-direction: column; align-items: center; font: 400 15px var(--disp); line-height: 1; gap: 2px; min-width: 38px; }
  .cost small { font: 700 10px var(--body); color: var(--muted); }
  .cost.free { color: var(--okc); }
  .tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tcard { text-align: left; font: 14px var(--body); color: var(--ink); background: var(--white); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px; cursor: pointer;
    display: flex; flex-direction: column; gap: 4px; min-height: 104px; position: relative; }
  .tcard[aria-pressed="true"] { background: var(--marker); border-width: 3px; box-shadow: 4px 4px 0 var(--ink); transform: translate(-2px, -2px); }
  .tcard:disabled { cursor: default; background: #F1F2F5; color: var(--muted); }
  .tcard .th { display: flex; align-items: center; gap: 6px; }
  .tcard .th .ic { font-size: 22px; line-height: 1; }
  .tcard .th { justify-content: space-between; }
  .tcard .tt { font: 400 16px var(--disp); line-height: 1.1; }
  .tcard .th .cost { min-width: 0; font-size: 13px; flex-direction: row; gap: 1px; }
  .tcard .th .cost small { font-size: 12px; }
  .tcard { min-width: 0; }
  .tcard .what { font-size: 12px; line-height: 1.3; }
  .vsrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
  .vsrow span { font: 700 10.5px var(--body); border-radius: 99px; padding: 1px 7px; border: 1.5px solid var(--ink); }
  .vsrow .s { background: var(--ok-l); } .vsrow .w { background: var(--bad-l); }
  .confirm { display: flex; flex-direction: column; gap: 4px; }
  .confirm .btn-main { display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.1; }
  .confirm .btn-main small { font: 500 13px var(--body); }
  /* Wer schlägt wen (Hilfe) */
  .cycle { display: block; align-self: center; width: min(100%, 300px); height: auto; flex: 0 0 auto; }
  .rules { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .rules div { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; }
  .rules div > span:first-child { font-size: 20px; line-height: 1.2; text-align: center; }
  /* Aufdecken: beide Wahlen nebeneinander */
  .reveal2 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: stretch; }
  .reveal2 .choice { border-top: 6px solid var(--tc); background: var(--tc-l); }
  .reveal2 .choice .who { font: 700 11px var(--body); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reveal2 .vs { align-self: center; font-size: 16px; }
  .verdict { font: 700 13px var(--body); text-align: center; background: var(--ink); color: var(--white); border-radius: 10px; padding: 5px 10px; }

  /* ---------- Kampfsystem v2 (2026-11-22): Kategorien → Aktionen, Kampf-Einstellungen, Belohnungen ---------- */
  :root { --k-atk: #E5484D; --k-def: #2F6FE4; --k-eva: #23965A; --k-tank: #E39A0B; }
  .settings { display: flex; flex-direction: column; gap: 8px; }
  .setrow { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; font: 700 13px var(--body); }
  .seg3 { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .seg3 button { font: 500 14px var(--body); background: var(--white); color: var(--ink); border: 0; border-right: 2px solid var(--ink); padding: 5px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-height: 44px; justify-content: center; }
  .seg3 button:last-child { border-right: 0; }
  .seg3 button small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg3 button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  .seg3 button[aria-pressed="true"] small { color: var(--marker); }
  .spieler { display: flex; align-items: center; gap: 8px; font: 500 14px var(--body); color: var(--ink); background: var(--white); border: 2px dashed var(--ink); border-radius: 99px; padding: 4px 12px; cursor: pointer; align-self: flex-start; }
  .spieler.set { border-style: solid; font-weight: 700; }
  .slot .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; } .slot .chips .chip { font-size: 10px; padding: 0 7px; }
  .xpcalc { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; } .xpcalc b { color: var(--ink); }
  .bilanz { text-align: center; font: 400 18px var(--disp); }
  .reward { align-self: flex-start; margin-top: 4px; font: 700 13px var(--body); background: var(--marker); border: 2px solid var(--ink); border-radius: 99px; padding: 3px 10px; cursor: pointer; color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .reward.big { font-size: 15px; padding: 8px 14px; align-self: stretch; }
  .ktiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ktile { text-align: left; font: 14px var(--body); color: var(--ink); background: var(--white); border: 3px solid var(--ink); border-radius: 16px; padding: 10px; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px; min-height: 128px; box-shadow: 4px 4px 0 var(--ink); position: relative; min-width: 0; }
  .ktile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; background: var(--kc); border-radius: 12px 12px 0 0; }
  .ktile .ki { font-size: 28px; line-height: 1; margin-top: 6px; }
  .ktile b { font: 400 18px var(--disp); color: var(--kc); line-height: 1.1; }
  .ktile .kn { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .ktile[aria-pressed="true"] { background: var(--marker); }
  .ktile[aria-pressed="true"] .kn { color: var(--ink); font-weight: 700; }
  .ktile:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .ktile:disabled { cursor: default; background: #F1F2F5; opacity: .6; box-shadow: none; }
  .ktile .why { font-size: 12px; font-weight: 700; color: var(--err); }
  .ktile .vsrow { margin-top: auto; }
  .vsrow .r { background: #E6F4EC; }
  .swbtn { font: 500 15px var(--body); color: var(--ink); background: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 48px; cursor: pointer; text-align: left; }
  .swbtn[aria-pressed="true"] { background: var(--marker); box-shadow: 3px 3px 0 var(--ink); }
  .swbtn:disabled { opacity: .5; cursor: default; }
  .back { font: 500 14px var(--body); background: none; border: 0; color: var(--ink); text-decoration: underline; cursor: pointer; padding: 6px 2px; align-self: flex-start; min-height: 40px; }
  .acard .extra { line-height: 1.3; }
  .acard .big { padding: 0 3px; min-height: 48px; height: auto; }
  .acard .big b.sm { font-size: 16px; } .acard .big b.xs { font-size: 12.5px; }
  .acard .big b { white-space: nowrap; }
  .wheel { display: flex; width: 100%; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .wheel i { font-style: normal; display: flex; flex-direction: column; align-items: center; padding: 6px 2px; background: #FFF3C4; border-right: 2px solid var(--ink); min-width: 0; transition: background .1s; }
  .wheel i:last-child { border-right: 0; }
  .wheel i b { font: 400 18px var(--disp); }
  .wheel i small { font: 700 10px var(--body); color: var(--muted); }
  .wheel i.cur { background: var(--marker); }
  .wheel i.res { background: var(--ink); color: var(--white); }
  .wheel i.res small { color: var(--marker); }
  .choice-card { border: 3px solid var(--ink); border-radius: 14px; background: var(--white); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; font: inherit; color: inherit; text-align: left; box-shadow: 3px 3px 0 var(--ink); }
  .choice-card b { font: 400 17px var(--disp); }
  .choice-card[aria-pressed="true"] { background: var(--marker); }
  /* Standardbild freigestellt: steht ohne Kasten auf dem Podest */
  .sprite.free { background: none; border: 0; box-shadow: none; padding: 0; }
  .sprite.free img { object-fit: contain; border-radius: 0; filter: drop-shadow(3px 4px 0 rgba(24,23,28,.28)); }
  .thumb img.std { object-fit: contain; padding: 3px; }

  /* ---------- Paket 1 „Sofort spürbar“ (2026-11-22) ---------- */
  /* feste Knopfleiste: deckend statt halb durchsichtig, nichts schimmert durch */
  .sticky { background: linear-gradient(rgba(238,240,242,0), var(--paper) 16px); padding-top: 18px; }
  .setsum { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: 14px var(--body); color: var(--ink); background: var(--white);
    border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-height: 48px; cursor: pointer; }
  .setsum span { flex: 1; } .setsum u { font-weight: 500; }
  .again { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; font: 15px var(--body); color: var(--ink); background: var(--marker);
    border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); }
  .again .ic { font: 400 26px var(--disp); }
  .again b { font: 400 17px var(--disp); display: block; }
  .again:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  /* Zugwahl in einem Schritt: Kachel zeigt bei nur einer Aktion gleich deren Werte */
  .ktile .kv { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .ktile .kv strong { font: 400 20px var(--disp); line-height: 1.1; white-space: nowrap; }
  .ktile .kv small { font-size: 11.5px; color: var(--muted); }
  .ktile .kc { font-size: 12px; color: var(--muted); }
  .ktile .more { position: absolute; right: 8px; top: 12px; font: 700 11px var(--body); background: var(--white); border: 1.5px solid var(--ink); border-radius: 99px; padding: 0 7px; }
  .picked { display: flex; flex-direction: column; gap: 6px; }
  .picked .acard { cursor: default; }
  /* Aufdecken-Countdown */
  .count3 { text-align: center; padding: 30px 12px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .count3 .num { font: 400 96px/1 var(--disp); }
  @media (prefers-reduced-motion: no-preference) { .count3 .num { animation: popin .35s ease both; } }
  .undo { display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--white); border-radius: 12px; padding: 6px 6px 6px 12px; font-size: 14px; }
  .undo span { flex: 1; }
  .undo button { font: 700 14px var(--body); background: var(--marker); color: var(--ink); border: 2px solid var(--white); border-radius: 10px; padding: 8px 12px; min-height: 44px; cursor: pointer; }
  .revbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tempo { font: 700 13px var(--body); background: var(--white); color: var(--ink); border: 2px solid var(--ink); border-radius: 99px; padding: 4px 12px; min-height: 36px; cursor: pointer; }
  .tempo[aria-pressed="true"] { background: var(--ink); color: var(--white); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="./">NÖRTI ARENA</a>
    <a class="pill" href="../sammlung/">Meine Sammlung</a>
  </header>
  <main id="app" class="actions" style="gap:14px"><div class="spinner" aria-label="Lädt"></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../app/common.js"></script>
<script src="../app/kampf.js"></script>
<script src="../app/feier.js"></script>
<script>
(async () => {
  const { api, esc, toast, sheet, closeSheet, errMsg, lobby, isLive } = Noerti;
  const liveChips = (e) => `${e.starter ? '<span class="chip stern">⭐ STARTER</span>' : ''}${isLive(e) ? '<span class="chip live">📡 LIVE</span>' : `<span class="chip samm">📋 SAMMLUNG${e.serial && e.live ? ' · neu scannen' : ''}</span>`}`;
  const K = window.NoertiKampf;
  const app = document.getElementById('app');
  const FIGHT = 'noerti-arena-kampf';
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, REDUCED ? Math.min(ms, 150) : ms));
  let types = [], game = null, F = null, STD = {}, timer = null;   // F = laufender Kampf {s, phase, side, pending, setup, last}
  const typeName = (id) => (types.find((t) => t.id === id) || {}).name || 'Typ ' + id;

  const saveF = () => { try { F ? localStorage.setItem(FIGHT, JSON.stringify(F)) : localStorage.removeItem(FIGHT); } catch {} };
  const loadF = () => { try { return JSON.parse(localStorage.getItem(FIGHT)); } catch { return null; } };

  // Tempo der Kampfanimation (1 = normal, 2 = doppelt so schnell) – wird auf diesem Handy gemerkt
  const TEMPO = 'noerti-arena-tempo';
  let speed = 1; try { speed = +localStorage.getItem(TEMPO) === 2 ? 2 : 1; } catch {}
  // Vibration bei Treffer, K.o. und Sieg (nur wo das Handy es kann, z. B. Android)
  const buzz = (p) => { try { if (!REDUCED && navigator.vibrate) navigator.vibrate(p); } catch {} };
  // Letzte Aufstellung (für „Wie letztes Mal“) – bleibt 14 Tage, die normale Aufstellung nur 30 min
  const LAST = 'noerti-arena-last', LAST_TTL = 14 * 24 * 3600 * 1000;
  const saveLast = (l) => { try { localStorage.setItem(LAST, JSON.stringify({ at: Date.now(), size: l.size, names: l.names, spieler: l.spieler, A: l.A, B: l.B, lp: l.lp, noerten: l.noerten })); } catch {} };
  const loadLast = () => { try { const x = JSON.parse(localStorage.getItem(LAST)); return x && Date.now() - x.at < LAST_TTL && x.A && x.A.length && x.B && x.B.length ? x : null; } catch { return null; } };
  let showSet = false;   // Kampf-Einstellungen aufgeklappt?
  // Teamname: selbst vergeben, sonst Besitzername – außer beide Teams gehören demselben Besitzer, dann nach Teamfarbe
  const COLOR = { A: 'Team Lila', B: 'Team Orange' };
  function teamName(l, side) {
    if (l.names[side]) return l.names[side];
    const sp = (l.spieler || {})[side], spo = (l.spieler || {})[side === 'A' ? 'B' : 'A'];
    if (sp && (!spo || sp.toLowerCase() !== spo.toLowerCase())) return sp;
    const o = (l[side][0] || {}).owner_name, oo = (l[side === 'A' ? 'B' : 'A'][0] || {}).owner_name;
    return o && o !== oo ? o : COLOR[side];
  }

  // ---------- Bausteine ----------
  function mug(v, max, size = 34) {
    const h = 30, fill = Math.max(0, Math.min(1, v / max)) * h, y = 8 + h - fill;
    return `<div class="mug" title="${v} Nörten"><svg width="${size}" height="${size * 1.2}" viewBox="0 0 36 44" aria-hidden="true">
      <rect class="liq" x="5" y="${y}" width="22" height="${fill}" fill="var(--beer)"/>
      ${fill > 1 ? `<path d="M5 ${y + 1} q3 -5 6 -1 q3 -5 6 0 q3 -5 6 0 q2 -4 4 0 v2 H5z" fill="var(--foam)" stroke="var(--ink)" stroke-width="1.5"/>` : ''}
      <path d="M5 6 h22 v32 a3 3 0 0 1 -3 3 h-16 a3 3 0 0 1 -3 -3z" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
      <path d="M27 14 h4 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-4" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
      <path d="M11 14 v20 M17 14 v20" stroke="var(--beer-d)" stroke-width="1.2" opacity=".5"/>
    </svg><span>${v}</span></div>`;
  }
  const lpColor = (p) => (p > 0.5 ? 'var(--lp)' : p > 0.2 ? 'var(--lp-mid)' : 'var(--lp-low)');
  // Effekte, die gerade oder in den nächsten Runden wirken
  const BAD = (e) => (['chance', 'schaden', 'ausweichen', 'tempo', 'schutz', 'regen', 'tank'].includes(e.art) ? e.wert < 0 : e.art === 'gift');
  function badges(f) {
    const b = (f.fx || []).map((e) => `<span class="${BAD(e) ? 'bad' : ''}">${esc((e.quelle === 'Konter' ? 'Konter: ' : '') + K.FX[e.art].text(e.wert))}${e.bis > e.von ? ` · ${e.bis - e.von + 1} R.` : ''}</span>`);
    return b.length ? `<div class="badges">${b.join('')}</div>` : '';
  }
  function fighter(s, side, big) {
    const t = s.teams[side], f = t.figs[t.active], p = f.lp / f.lpMax;
    return `<div class="fighter ${big ? 'big' : ''} ${f.ko ? 'ko' : ''}" data-side="${side}">
      <div class="thumb hatch">${thumb(f)}</div>
      <div class="info">
        <span class="team-l">${esc(t.name)}${t.figs.length > 1 ? ` · <span class="bench">${t.figs.map((x) => `<span class="${x.ko ? 'ko' : ''}"></span>`).join('')}</span>` : ''}</span>
        <div class="nm"><b>${esc(f.name)}</b><span class="lv">LV ${f.level}</span></div>
        <div class="lpbar"><div style="width:${Math.round(p * 100)}%;background:${lpColor(p)}"></div></div>
        <span class="lptext">${f.lp} / ${f.lpMax} LP${f.ko ? ' · k.o.' : ''}</span>
        ${badges(f)}
      </div>
      ${mug(f.noerten, f.noertenMax, big ? 40 : 30)}
    </div>`;
  }
  // ---------- Aktionen beschreiben ----------
  const range = (a) => { const o = a.ausgaenge; return o.length > 1 ? `${Math.min(...o.map((x) => x.wert))}–${Math.max(...o.map((x) => x.wert))}` : String(o[0].wert); };
  const times = (a) => (a.wuerfe.art === 'mehrfach' ? `${a.wuerfe.n}×` : a.wuerfe.art === 'zufall' ? `${a.wuerfe.n}–${a.wuerfe.bis}×` : a.wuerfe.art === 'kette' ? `≤${a.wuerfe.n}×` : '');
  const hurts = (a) => a.ausgaenge.some((o) => o.wert > 0);
  function big(a, chance) {        // große Zahl + Einheit auf der Karte
    if (a.kat === 'angriff') return hurts(a) ? { v: times(a) + range(a), u: 'SCHADEN' } : { v: '✨', u: 'EFFEKT', cls: 'fx' };
    if (a.kat === 'verteidigung') return a.sonder.schild ? { v: range(a), u: 'SCHLUCKT' } : { v: '−' + range(a) + '%', u: 'SCHUTZ' };
    if (a.kat === 'ausweichen') return { v: chance + '%', u: 'AUSWEICHEN' };
    return { v: '+' + times(a) + range(a), u: 'NÖRTEN', cls: 'heal' };
  }
  function details(a) {           // kleine Zeilen unter dem Namen
    const d = [];
    if (a.ausgaenge.length > 1) d.push('🎡 ' + a.ausgaenge.map((o) => `${o.anteil} %: ${o.wert}`).join(' · '));
    if (a.wuerfe.art === 'mehrfach') d.push(`${a.wuerfe.n} Würfe, jeder einzeln`);
    if (a.wuerfe.art === 'zufall') d.push(`${a.wuerfe.n}–${a.wuerfe.bis} Würfe (wird ausgewürfelt)`);
    if (a.wuerfe.art === 'kette') d.push(`Kette: weiter bis zum ersten Fehlwurf${a.wuerfe.steigerung ? `, +${a.wuerfe.steigerung} je Glied` : ''}`);
    const so = a.sonder;
    if (so.durchschlag) d.push(`schlägt ${so.durchschlag} % der Abwehr durch`);
    if (so.lebensraub) d.push(`heilt ${so.lebensraub} % des Schadens`);
    if (so.rueckstoss) d.push(`Rückstoß −${so.rueckstoss} LP`);
    if (so.unausweichlich) d.push('unausweichlich');
    if (so.zuerst) d.push('immer zuerst dran');
    if (so.fest) d.push('Tempo zählt nicht');
    if (so.halb) d.push('misslingt es: nur halber Schaden');
    if (so.gegenschlag) d.push(`klappt es: ${so.gegenschlag} Gegenschlag`);
    if (so.lp) d.push(`+${so.lp} LP`);
    for (const e of a.effekte) d.push(`${e.wann === 'erfolg' ? 'Erfolg' : e.wann === 'fehlschlag' ? 'Fehlschlag' : 'immer'}: ${e.ziel === 'gegner' ? 'Gegner ' : ''}${K.fxText(e)}`);
    return d;
  }
  function actLabel(s, side, a) {
    const f = K.aktiv(s, side);
    if (a.typ === 'wechseln') return { t: '🔄 Wechsel', d: 'zu ' + s.teams[side].figs[a.i].name, kat: 'wechseln' };
    const x = f.aktionen[a.i], b = big(x, x.wuerfe.chance);
    return { t: x.name, d: x.kat === 'ausweichen' ? 'ganz oder gar nicht' : `${b.v} ${b.u.toLowerCase()}`, kat: x.kat };
  }

  // ---------- Aufstellung ----------
  async function renderLobby() {
    F = null; saveF();
    const l = lobby.load(); lobby.save(l);
    const missing = (e) => !game.data.typen[e.type_id];
    const team = (side) => {
      const list = l[side], ph = teamName({ ...l, names: {} }, side);
      let slots = list.map((e, i) => { const off = offen(e);
        return `<div class="slot">
          <div class="thumb hatch">${thumb(e)}</div>
          <div class="who"><b>${esc(e.name)}</b><span class="small muted">LV ${e.level} · ${esc(typeName(e.type_id))}${e.owner_name ? ' · ' + esc(e.owner_name) : ''}</span>
            <span class="chips">${liveChips(e)}</span>
            ${missing(e) ? '<div class="warn">Noch keine Kampfwerte – im Editor anlegen</div>' : ''}
            ${off.length && e.serial ? `<button class="reward" data-reward="${side}${i}">⭐ ${off.length === 1 ? '1 Belohnung' : off.length + ' Belohnungen'} wählen</button>` : ''}</div>
          <button class="x" data-del="${side}${i}" aria-label="${esc(e.name)} entfernen">×</button></div>`; }).join('');
      for (let i = list.length; i < l.size; i++) slots += `<button class="slot empty" data-add="${side}">＋ Figur ${i + 1} hinzufügen</button>`;
      return `<section class="team card t${side}"><span class="tchip">${COLOR[side].toUpperCase()}</span><span class="count">${list.length} / ${l.size}</span>
        <input class="team-name" data-name="${side}" value="${esc(l.names[side] || '')}" placeholder="${esc(ph)} ✎" maxlength="20" aria-label="Name Team ${side}">
        <button class="spieler ${l.spieler[side] ? 'set' : ''}" data-player="${side}">👤 ${l.spieler[side] ? esc(l.spieler[side]) + ' kämpft' : 'Spieler wählen'}</button>${slots}</section>`;
    };
    const ready = l.A.length === l.size && l.B.length === l.size && ![...l.A, ...l.B].some(missing);
    const todo = ['A', 'B'].filter((x) => l[x].length < l.size).map((x) => `<b>${esc(teamName(l, x))}</b> fehlt noch ${l.size - l[x].length === 1 ? '1 Figur' : (l.size - l[x].length) + ' Figuren'}`);
    if (!todo.length && !ready) todo.push('Eine Figur hat noch keine Kampfwerte');
    const filled = l.A.length + l.B.length;
    const last = filled ? null : loadLast();
    const lastNames = (side) => last[side].map((e) => esc(e.name)).join(', ');
    app.innerHTML = `
      <div><h1>ARENA</h1><p class="muted" style="margin:4px 0 0">Stellt eure Teams auf: Figuren scannen (📡 live, doppelte XP) oder aus der Sammlung des Spielers wählen (📋 halbe XP). Danach wählt jeder verdeckt seinen Zug.</p></div>
      ${last ? `<button class="again" id="last"><span class="ic">↺</span><span><b>Wie letztes Mal</b>${lastNames('A')} gegen ${lastNames('B')}</span></button>` : ''}
      <div class="steps" aria-hidden="true"><span class="done">① Teamgröße</span><span class="${ready ? 'done' : 'now'}">② Figuren</span><span class="${ready ? 'now' : ''}">③ Kämpfen</span></div>
      <div class="sizes" role="group" aria-label="Teamgröße">${[1, 2, 3].map((n) => `<button data-size="${n}" aria-pressed="${l.size === n}">${n} gegen ${n}</button>`).join('')}</div>
      ${settingsHtml(l)}
      ${team('A')}<div class="vs">VS</div>${team('B')}
      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"><a class="btn-text" href="../bestenliste/" style="text-decoration:underline">🏆 Bestenliste</a>
      ${filled ? '<button class="btn-text" id="clear" style="text-decoration:underline">Aufstellung leeren</button>' : ''}</div>
      <div class="sticky actions">${ready ? '' : `<p class="todo">${todo.join(' · ')}</p>`}<button class="btn-main" id="go" ${ready ? '' : 'disabled'}>KAMPF STARTEN</button></div>`;
    const lb = app.querySelector('#last'); if (lb) lb.onclick = () => restoreLast(last, lb);
    const so = app.querySelector('#setopen'); if (so) so.onclick = () => { showSet = true; renderLobby(); };
    app.querySelectorAll('[data-size]').forEach((b) => b.onclick = () => {
      const n = +b.dataset.size; l.size = n; l.A = l.A.slice(0, n); l.B = l.B.slice(0, n); lobby.save(l); renderLobby();
    });
    app.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { l[b.dataset.del[0]].splice(+b.dataset.del.slice(1), 1); lobby.save(l); renderLobby(); });
    app.querySelectorAll('[data-set]').forEach((b) => b.onclick = () => { l[b.dataset.set] = +b.dataset.i; lobby.save(l); renderLobby(); });
    app.querySelectorAll('[data-reward]').forEach((b) => b.onclick = () => {
      const e = l[b.dataset.reward[0]][+b.dataset.reward.slice(1)];
      rewardSheet(e, (w) => { const l2 = lobby.load(); for (const x of [...l2.A, ...l2.B]) if (x.public_id === e.public_id) x.wahlen = w; lobby.save(l2); renderLobby(); });
    });
    app.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => addSheet(b.dataset.add));
    app.querySelectorAll('[data-player]').forEach((b) => b.onclick = () => playerSheet(b.dataset.player));
    app.querySelectorAll('[data-name]').forEach((i) => i.oninput = () => { l.names[i.dataset.name] = i.value.trim(); lobby.save(l); });
    const c = app.querySelector('#clear'); if (c) c.onclick = () => { lobby.clear(); renderLobby(); };
    app.querySelector('#go').onclick = () => startFight(l);
  }

  // ---------- Kampf-Einstellungen & Belohnungen ----------
  function settingsHtml(l) {
    const R = game.data.regeln, std = R.kampf_standard ?? 1;
    if (!showSet) {   // eingeklappt: eine Zeile mit den aktuellen Werten
      const cur = (k, key) => esc(R[k][l[key] ?? std].name);
      return `<button class="setsum" id="setopen" aria-expanded="false"><span>Lebenspunkte <b>${cur('kampf_lp', 'lp')}</b> · Nörten <b>${cur('kampf_noerten', 'noerten')}</b></span><u>Ändern</u></button>`;
    }
    const row = (k, key, label) => `<div class="setrow"><span>${label}</span><div class="seg3" role="group" aria-label="${label}">${R[k].map((x, i) =>
      `<button data-set="${key}" data-i="${i}" aria-pressed="${(l[key] ?? std) === i}">${esc(x.name)}<small>${x.wert}</small></button>`).join('')}</div></div>`;
    return `<section class="card settings">${row('kampf_lp', 'lp', 'Lebenspunkte')}${row('kampf_noerten', 'noerten', 'Nörten')}
      <p class="small muted" style="margin:0">Jede Figur multipliziert diese Werte mit ihrem eigenen Faktor.</p></section>`;
  }
  const kampfOpts = (l) => { const R = game.data.regeln, std = R.kampf_standard ?? 1; return { lp: R.kampf_lp[l.lp ?? std].wert, noerten: R.kampf_noerten[l.noerten ?? std].wert }; };
  function offen(e) { try { return K.ausbau(game.data, e.type_id, e.level, e.wahlen || {}).offen; } catch { return []; } }
  function optionCard(t, o, i) {
    let extra = '';
    if (o.art === 'lernt') { const a = (t.aktionen || []).find((x) => x.id === o.aktion); if (a) { const x = K.aktionBauen(a, []), b = big(x, x.wuerfe.chance); extra = `<span class="small muted">${esc(KAT_UI[x.kat].icon)} ${KAT_UI[x.kat].name} · ${esc(b.v)} ${b.u.toLowerCase()} · ${x.wuerfe.chance < 100 ? x.wuerfe.chance + ' %' : 'sicher'} · ${x.kosten} Nörten</span>${details(x).map((d) => `<span class="small muted">${esc(d)}</span>`).join('')}`; } }
    return `<button class="choice-card" data-opt="${i}"><b>${esc(K.optionText(t, o))}</b>${extra}</button>`;
  }
  // Belohnung wählen (Level-Pfad). Wer die Figur in der Hand hat, wählt – endgültig.
  function rewardSheet(e, done, changed) {
    const t = game.data.typen[e.type_id], off = offen(e);
    if (!t || !off.length) { closeSheet(); done && done(e.wahlen || {}); return; }
    const lv = off[0], opts = t.pfad[lv];
    let pick = null;
    const el = sheet(`<h2>${esc(e.name)}: Belohnung für Level ${lv}</h2>
      <p class="small muted" style="margin:0">Wähle eine – die Wahl gilt für immer${off.length > 1 ? ` (danach noch ${off.length - 1} weitere)` : ''}.</p>
      <div class="actions" style="gap:10px">${opts.map((o, i) => optionCard(t, o, i)).join('')}</div>
      <button class="btn-main" id="take" disabled>BELOHNUNG WÄHLEN</button><button class="btn-text" id="later">Später</button>`);
    el.querySelectorAll('[data-opt]').forEach((b) => b.onclick = () => {
      pick = +b.dataset.opt; el.querySelectorAll('[data-opt]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      const take = el.querySelector('#take'); take.disabled = false; take.textContent = K.optionText(t, opts[pick]).toUpperCase() + ' NEHMEN';
    });
    el.querySelector('#later').onclick = () => { closeSheet(); if (changed && done) done(e.wahlen); };
    el.querySelector('#take').onclick = async (ev) => {
      ev.target.disabled = true;
      try {
        const r = await api.chooseReward(e.serial, lv, pick);
        e.wahlen = (r && r.wahlen) || { ...(e.wahlen || {}), [lv]: pick };
        toast(`✓ ${K.optionText(t, opts[pick])}`);
        if (offen(e).length) rewardSheet(e, done, true); else { closeSheet(); done && done(e.wahlen); }
      } catch (err) {
        ev.target.disabled = false;
        const m = errMsg(err);
        if (/schon gewählt/.test(m)) {      // Aufstellung war veraltet: Wahlen neu laden
          try { const f = await api.getFigure(e.serial); if (f) { e.wahlen = f.wahlen || {}; toast('Schon gewählt – aktualisiert.'); rewardSheet(e, done, true); return; } } catch {}
        }
        toast(/function|schema cache/i.test(m) ? 'SQL-Nachtrag 006 fehlt noch in Supabase' : m, 'err');
      }
    };
  }

  async function entryFor(serial) {
    const f = await api.getFigure(serial);
    if (!f) throw new Error('Diese Figur ist nicht registriert.');
    const img = f.images && f.images.length ? await api.imageUrl(f.public_id, f.images.slice().sort()[0], f.updated_at) : '';
    return { serial, live: true, liveAt: Date.now(), starter: !!f.starter, public_id: f.public_id, type_id: f.type_id, level: f.level, wahlen: f.wahlen || {}, name: f.nickname || typeName(f.type_id), owner_name: f.owner_name, img };
  }

  // Spieler einer Seite wählen: Suche nach Namen; ihre Sammlung steht danach beim Hinzufügen zur Auswahl
  async function playerSheet(side) {
    const l = lobby.load();
    let me = null; try { me = await api.me(); } catch {}
    const el = sheet(`<h2>Wer kämpft für ${esc(teamName(l, side))}?</h2>
      <label class="field">Spielername<input id="pq" autocomplete="off" placeholder="z. B. Leif" maxlength="16"></label>
      <div class="pick-list" id="plist"><div class="spinner"></div></div>
      ${l.spieler[side] ? '<button class="btn-text" id="pnone">Ohne Spieler</button>' : ''}<button class="btn-text" id="pclose">Schließen</button>`);
    const box = el.querySelector('#plist'), q = el.querySelector('#pq');
    const pick = (name) => { const l2 = lobby.load(); l2.spieler[side] = name; if (name) { const o = other(side); if ((l2.spieler[o] || '').toLowerCase() === name.toLowerCase()) l2.spieler[o] = null; } lobby.save(l2); closeSheet(); renderLobby(); };
    let t = null;
    const search = async () => {
      try {
        const list = await api.findPlayers(q.value.trim());
        box.innerHTML = list.length ? list.map((p) => `<button data-pn="${esc(p.name)}"><span class="thumb" style="background:var(--marker)">${esc(p.name[0].toUpperCase())}</span>
          <span><b>${esc(p.name)}</b>${me && me.name === p.name ? ' (du)' : ''}<br><span class="small muted">${p.figuren} ${p.figuren === 1 ? 'Figur' : 'Figuren'}</span></span></button>`).join('')
          : '<p class="small muted" style="margin:0">Niemand gefunden.</p>';
        box.querySelectorAll('[data-pn]').forEach((b) => b.onclick = () => pick(b.dataset.pn));
      } catch (e) { box.innerHTML = `<p class="warn">${/function|schema cache/i.test(errMsg(e)) ? 'SQL-Nachtrag 008 fehlt noch in Supabase.' : esc(errMsg(e))}</p>`; }
    };
    q.oninput = () => { clearTimeout(t); t = setTimeout(search, 200); };
    search();
    const n = el.querySelector('#pnone'); if (n) n.onclick = () => pick(null);
    el.querySelector('#pclose').onclick = closeSheet;
  }
  function addTo(side, entry) {
    const l = lobby.load(); l.want = side; lobby.save(l);
    const got = lobby.add(entry);
    if (!got) toast('Beide Teams sind voll.', 'err'); else if (got !== side) toast(`${entry.name} ist schon in Team ${got}.`);
    closeSheet(); renderLobby();
  }
  async function addSheet(side) {
    const l = lobby.load(); l.want = side; lobby.save(l);
    const nfc = 'NDEFReader' in window;
    const el = sheet(`<h2>Figur für ${esc(teamName(l, side))}</h2>
      ${nfc ? `<button class="btn-main" id="scan">FIGUR SCANNEN</button><p class="small muted" id="scanHint">Tippen, dann die Figur an die Rückseite des Handys halten.</p>`
            : `<p>Halte die Figur an die Rückseite des Handys. Auf der Figurenseite dann <b>„In die Arena“</b> tippen – sie landet in diesem Team.</p>`}
      <b id="collT">Aus der Sammlung</b><div class="pick-list" id="mine"><div class="spinner"></div></div>
      <button class="btn-text" id="close">Schließen</button>`);
    el.querySelector('#close').onclick = closeSheet;
    if (nfc) el.querySelector('#scan').onclick = async () => {
      const hint = el.querySelector('#scanHint');
      try {
        const r = new NDEFReader(); const ctl = new AbortController();
        await r.scan({ signal: ctl.signal }); hint.textContent = 'Bereit – Figur jetzt ranhalten …';
        r.onreading = async (ev) => {
          for (const rec of ev.message.records) {
            if (rec.recordType !== 'url') continue;
            const u = new URL(new TextDecoder().decode(rec.data)), s = (u.searchParams.get('s') || '').toUpperCase();
            if (!s) continue;
            ctl.abort();
            try { addTo(side, await entryFor(s)); } catch (e) { hint.textContent = errMsg(e); }
            return;
          }
          hint.textContent = 'Das ist kein Nörti-Tag im neuen Format.';
        };
      } catch (e) { hint.textContent = 'Scannen geht nicht: ' + errMsg(e); }
    };
    // Sammlung des Spielers dieser Seite – ohne Spieler die eigene. Sammlungsfiguren kämpfen mit halben XP (nicht gescannt).
    const box = el.querySelector('#mine');
    let me = null; try { me = await api.me(); } catch {}
    const who = l.spieler[side] || (me && me.name) || null, mine = !!(me && me.name && who && who.toLowerCase() === me.name.toLowerCase());
    if (!who) { box.innerHTML = '<p class="small muted" style="margin:0">Wähle oben im Team den Spieler – dann steht hier seine Sammlung.</p>'; return; }
    el.querySelector('#collT').textContent = `Aus der Sammlung von ${mine ? 'dir' : who} (📋 halbe XP)`;
    try {
      const used = new Set([...l.A, ...l.B].map((e) => e.public_id));
      const all = mine ? await api.myCollection() : ((await api.playerCollection(who)) || { figuren: [] }).figuren;
      const list = all.filter((f) => !used.has(f.public_id));
      if (!list.length) { box.innerHTML = `<p class="small muted" style="margin:0">Keine weiteren Figuren in der Sammlung von ${esc(mine ? 'dir' : who)}.</p>`; return; }
      for (const f of list) f._img = f.images && f.images.length ? await api.imageUrl(f.public_id, f.images.slice().sort()[0], f.updated_at) : '';
      box.innerHTML = list.map((f, i) => `<button data-i="${i}"><span class="thumb hatch">${thumb({ img: f._img, type_id: f.type_id })}</span>
        <span><b>${esc(f.nickname || typeName(f.type_id))}</b>${f.starter ? ' ⭐' : ''}<br><span class="small muted">LV ${f.level} · ${esc(typeName(f.type_id))}</span></span></button>`).join('');
      box.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => {
        const f = list[+b.dataset.i];
        addTo(side, { serial: f.serial || null, live: false, starter: !!f.starter, public_id: f.public_id, type_id: f.type_id, level: f.level, wahlen: f.wahlen || {}, name: f.nickname || typeName(f.type_id), owner_name: f.owner_name || who, img: f._img });
      });
    } catch (e) { box.innerHTML = `<p class="warn">${/function|schema cache/i.test(errMsg(e)) ? 'SQL-Nachtrag 008 fehlt noch in Supabase.' : esc(errMsg(e))}</p>`; }
  }

  // „Wie letztes Mal“: Aufstellung zurückholen, Level/Wahlen/Besitzer frisch aus der Datenbank (falls inzwischen gelevelt oder getauscht)
  async function restoreLast(last, btn) {
    btn.disabled = true;
    const fresh = async (e) => {      // live gilt nicht weiter – wer doppelte XP will, scannt neu
      const base = { ...e, live: false };
      try { const f = e.serial ? await api.getFigure(e.serial) : await api.getFigureById(e.public_id); if (!f) return null;
        return { ...base, level: f.level, wahlen: f.wahlen || {}, owner_name: f.owner_name, starter: !!f.starter, name: f.nickname || typeName(f.type_id) }; }
      catch { return base; }   // offline: alter Stand
    };
    const l = lobby.load();
    l.size = last.size; l.names = { ...last.names }; l.lp = last.lp; l.noerten = last.noerten; l.spieler = { ...(last.spieler || { A: null, B: null }) };
    l.A = (await Promise.all(last.A.map(fresh))).filter(Boolean); l.B = (await Promise.all(last.B.map(fresh))).filter(Boolean);
    lobby.save(l); renderLobby();
  }

  // ---------- Kampf ----------
  function startFight(l) {
    const mk = (side) => ({ name: teamName(l, side),
      figs: l[side].map((e) => ({ key: e.public_id, type_id: e.type_id, level: e.level, wahlen: e.wahlen || {}, name: e.name, img: e.img, owner: e.owner_name })) });
    let A = mk('A'), B = mk('B');
    if (A.name === B.name) { A.name += ' (Lila)'; B.name += ' (Orange)'; }
    saveLast(l);
    const ent = (e) => ({ s: isLive(e) ? e.serial : null, p: e.public_id, liveAt: e.liveAt || 0, starter: !!e.starter });
    try { newFight({ A, B, opts: kampfOpts(l), spieler: { ...l.spieler }, entries: { A: l.A.map(ent), B: l.B.map(ent) } }, { A: l.A.map((e) => e.serial || null), B: l.B.map((e) => e.serial || null) }); }
    catch (e) { toast(errMsg(e), 'err'); return; }
    saveF(); render();
  }
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
  function newFight(setup, serials) {
    F = { id: uuid(), s: K.neu(game.data, setup.A, setup.B, setup.opts || {}), phase: 'hand', side: 'A', pending: {}, setup, serials, version: game.version, report: null };
  }
  const other = (x) => (x === 'A' ? 'B' : 'A');
  // Wer zuerst wählt, wechselt jede Runde: wer zuletzt gewählt hat, hält das Handy schon und fängt an → nur eine Übergabe pro Runde
  const firstSide = (s) => (s.runde % 2 ? 'A' : 'B');

  function renderHand() {
    const name = F.s.teams[F.side].name, oName = F.s.teams[other(F.side)].name;
    const erster = F.side === firstSide(F.s), first = erster && F.s.runde === 1, behalten = erster && F.s.runde > 1;
    const canUndo = !erster && F.pending[other(F.side)] && F.undo && Date.now() < F.undo;
    app.innerHTML = `${roundBar(F.s)}
      ${canUndo ? `<div class="undo" id="undobar"><span>${esc(oName)}: Wahl gespeichert</span><button id="undo">↩ Doch anders</button></div>` : ''}
      <div class="hand card ink t${F.side}"><div class="avatar">${esc([...name.replace(/^team\s+/i, '')][0].toUpperCase())}</div>
      <h1>${first ? 'Los geht’s,' : behalten ? 'Du wählst zuerst,' : 'Gib das Handy an'}<br>${esc(name)}</h1>
      <p style="margin:0"><b>🙈 ${esc(oName)}</b> schaut weg.<br><span class="muted">${erster ? `Danach wählt ${esc(oName)}, dann wird gleichzeitig aufgedeckt.` : `${esc(oName)} hat schon gewählt – jetzt bist du dran.`}</span></p>
      <button class="btn-main" id="ok">ICH BIN ${esc(name.toUpperCase())}</button></div>
      <button class="btn-text" id="quit">Kampf abbrechen</button>`;
    if (canUndo) {
      app.querySelector('#undo').onclick = () => undoPick(other(F.side));
      timer = setTimeout(() => { const b = app.querySelector('#undobar'); if (b) b.remove(); }, F.undo - Date.now());
    }
    app.querySelector('#ok').onclick = () => { F.undo = null; F.phase = 'pick'; F.choice = null; F.cat = null; saveF(); render(); };
    app.querySelector('#quit').onclick = quit;
  }

  // ---------- Kampfbühne ----------
  const D20 = `<svg viewBox="0 0 100 100" aria-hidden="true"><polygon class="face" points="50,3 93,27 93,73 50,97 7,73 7,27" fill="#fff" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="50,24 80,72 20,72" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M50 3 L50 24 M93 27 L80 72 M7 27 L20 72 M93 73 L80 72 M7 73 L20 72 M50 97 L80 72 M50 97 L20 72 M7 27 L50 24 M93 27 L50 24" stroke="var(--ink)" stroke-width="1.6" opacity=".55"/></svg>`;
  // Kampfbühne: immer das Standardbild (freigestellt steht es frei auf dem Podest), sonst eigenes Foto, sonst Typ-Nummer
  function sprite(f) {
    const s = STD[f.type_id];
    if (s) return `<div class="sprite ${s.transparent ? 'free' : ''} ${f.ko ? 'koed' : ''}"><img src="${esc(s.url)}" alt=""></div>`;
    return f.img ? `<div class="sprite ${f.ko ? 'koed' : ''}"><img src="${esc(f.img)}" alt=""></div>`
      : `<div class="sprite noimg ${f.ko ? 'koed' : ''}"><span class="sp-id">${esc(f.type_id)}</span><span class="sp-n">${esc(typeName(f.type_id))}</span></div>`;
  }
  // kleine Vorschaubilder: eigenes Foto, sonst Standardbild
  function thumb(x) {
    if (x.img) return `<img src="${esc(x.img)}" alt="">`;
    const s = STD[x.type_id];
    return s ? `<img class="${s.transparent ? 'std' : ''}" src="${esc(s.url)}" alt="">` : esc(x.type_id);
  }
  function ibox(s, side) {
    const t = s.teams[side], f = t.figs[t.active], p = f.lp / f.lpMax;
    return `<div class="main">
        <div class="nm"><b>${esc(f.name)}</b><span class="lv">LV ${f.level}</span></div>
        <div class="hp"><span class="hp-l">LP</span><div class="lpbar"><div class="lpfill" style="width:${Math.round(p * 100)}%;background:${lpColor(p)}"></div></div></div>
        <div class="ib-row"><span class="lptext">${f.lp} / ${f.lpMax}</span>${t.figs.length > 1 ? `<span class="bench">${t.figs.map((x) => `<span class="${x.ko ? 'ko' : ''}"></span>`).join('')}</span>` : ''}<span class="team-l">${esc(t.name)}</span></div>
      </div>${mug(f.noerten, f.noertenMax, 22)}${badges(f)}`;
  }
  function stage(s, near, bubbles, compact) {
    const spot = (side, pos) => `<div class="ibox ${pos} t${side}" data-side="${side}">${ibox(s, side)}</div>
      <div class="fig ${pos}" data-side="${side}"><div class="plat"></div>${sprite(K.aktiv(s, side))}
        ${bubbles && bubbles[side] ? `<div class="bubble">${esc(bubbles[side])}</div>` : ''}</div>`;
    return `<div class="stage ${compact ? 'compact' : ''}" id="stage">${spot(other(near), 'far')}${spot(near, 'near')}<div class="fx" id="fx"></div></div>`;
  }
  const bubbleText = (l) => (l.kat === 'wechseln' ? l.t : `${(KAT_UI[l.kat] || {}).icon || '⚔️'} ${l.t}`);

  // ---------- Wer schlägt wen (gemeinsam für Wählen, Aufdecken, Hilfe) ----------
  const KAT_UI = {
    angriff: { icon: '⚔️', name: 'Angriff', c: 'var(--k-atk)', frage: 'zuschlagen' },
    verteidigung: { icon: '🛡️', name: 'Verteidigung', c: 'var(--k-def)', frage: 'abwehren' },
    ausweichen: { icon: '💨', name: 'Ausweichen', c: 'var(--k-eva)', frage: 'ausweichen' },
    auftanken: { icon: '🍺', name: 'Auftanken', c: 'var(--k-tank)', frage: 'Krug füllen' },
    wechseln: { icon: '🔄', name: 'Wechseln', c: 'var(--ink)' }
  };
  const ICON = Object.fromEntries(Object.entries(KAT_UI).map(([k, v]) => [k, v.icon]));
  const NAME = Object.fromEntries(Object.entries(KAT_UI).map(([k, v]) => [k, v.name]));
  const VS = {   // was diese Kategorie schlägt (s) und wogegen sie schwach ist (w)
    angriff: { s: ['auftanken'], w: ['verteidigung'] },
    verteidigung: { s: ['angriff'], w: ['auftanken'] },
    auftanken: { s: ['verteidigung'], w: ['angriff'] },
    ausweichen: { s: [], w: [] }
  };
  const vsRow = (typ) => { const v = VS[typ]; if (!v) return '';
    if (typ === 'ausweichen') return '<div class="vsrow"><span class="r">🎲 riskant gegen ⚔️ Angriff</span></div>';
    return `<div class="vsrow">${v.s.map((x) => `<span class="s">✓ gegen ${ICON[x]} ${NAME[x]}</span>`).join('')}${v.w.map((x) => `<span class="w">✗ gegen ${ICON[x]} ${NAME[x]}</span>`).join('')}</div>`; };
  const komma = (x) => String(x).replace('.', ',');
  function verdict(R, a, b) {   // kurzer Satz, was beim Aufdecken passiert (aus Sicht der Regeln, ohne Würfel)
    const k = a + '|' + b, f = komma(R.getroffen_faktor);
    const t = {
      'angriff|auftanken': `⚔️ schlägt 🍺 – Angriff trifft mit ×${f}, Auftanken ${R.auftanken_getroffen_faktor > 0 ? `bringt nur ×${komma(R.auftanken_getroffen_faktor)}` : 'wird verschüttet'}`,
      'angriff|verteidigung': '🛡️ schlägt ⚔️ – greift die Abwehr, gibt es weniger Schaden und einen Konter',
      'angriff|angriff': '⚔️ gegen ⚔️ – wer schneller ist, trifft zuerst',
      'angriff|ausweichen': '💨 gegen ⚔️ – Würfelduell: ganz oder gar nicht',
      'verteidigung|auftanken': `🍺 schlägt 🛡️ – Auftanken bringt ×${komma(R.auftanken_gegen_verteidigen_faktor)}`,
      'auftanken|auftanken': 'Beide tanken auf',
      'verteidigung|verteidigung': 'Beide warten ab – nichts passiert',
      'ausweichen|ausweichen': 'Beide weichen aus – nichts passiert',
      'ausweichen|verteidigung': 'Niemand greift an – nichts passiert',
      'ausweichen|auftanken': '🍺 tankt in Ruhe, 💨 war umsonst'
    };
    if (a === 'wechseln' || b === 'wechseln') return '🔄 Der Wechsel passiert zuerst';
    return t[k] || t[b + '|' + a] || '';
  }
  function helpSheet() {
    const R = game.data.regeln, f = komma(R.getroffen_faktor);
    const node = (x, y, ic, t) => `<g><circle cx="${x}" cy="${y}" r="34" fill="#fff" stroke="var(--ink)" stroke-width="3"/><text x="${x}" y="${y + 2}" font-size="26" text-anchor="middle">${ic}</text><text x="${x}" y="${y + 52}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)" font-family="Rubik, sans-serif">${t}</text></g>`;
    const arrow = (x1, y1, x2, y2, lx, ly) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--okc)" stroke-width="4" marker-end="url(#ah)"/><text x="${lx}" y="${ly}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--okc)" font-family="Rubik, sans-serif">schlägt</text>`;
    sheet(`<h2>Wer schlägt wen?</h2>
      <p class="small muted">Beide wählen verdeckt, dann wird gleichzeitig aufgedeckt. Die Pfeile zeigen, wer im Vorteil ist.</p>
      <svg class="cycle" viewBox="0 0 300 250" role="img" aria-label="Angriff schlägt Auftanken, Auftanken schlägt Verteidigen, Verteidigen schlägt Angriff">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--okc)"/></marker></defs>
        ${arrow(180, 66, 222, 136, 222, 92)}${arrow(200, 186, 104, 186, 152, 178)}${arrow(80, 136, 122, 66, 78, 92)}
        ${node(150, 42, '⚔️', 'ANGRIFF')}${node(246, 168, '🍺', 'AUFTANKEN')}${node(54, 168, '🛡️', 'VERTEIDIGEN')}
      </svg>
      <div class="rules">
        <div><span>🎯</span><span>Jede Figur hat eigene <b>Aktionen</b> in vier Kategorien. Wer wen schlägt, entscheidet die <b>Kategorie</b> – wie stark, entscheidet die Aktion.</span></div>
        <div><span>⚔️</span><span><b>Angriff</b> trifft beim Auftanken mit ×${f}. Gegen Verteidigung wird abgewehrt – greift die Abwehr, bekommt der Gegner einen Konter.</span></div>
        <div><span>🛡️</span><span><b>Verteidigung</b> würfelt, ob die Abwehr greift (z. B. −40 % Schaden oder ein Schild, das Punkte schluckt). Greift sie, gibt es einen <b>Konter</b>: +${R.konter_treffer} % Treffer in der nächsten Runde, Angreifer verliert ${R.konter_noerten} Nörten${R.konter_schaden > 0 ? ` und sofort ${R.konter_schaden} LP` : ''}.</span></div>
        <div><span>🍺</span><span><b>Auftanken</b> füllt den Krug – wie viel, steht auf der Karte. Verteidigt der Gegner nur, gibt es ×${komma(R.auftanken_gegen_verteidigen_faktor)}. Wird man getroffen, ${R.auftanken_getroffen_faktor > 0 ? `nur ×${komma(R.auftanken_getroffen_faktor)}` : 'ist alles verschüttet – kein einziger Nörti'}.</span></div>
        <div><span>💨</span><span><b>Ausweichen</b> ist die riskante Wahl: Würfelduell gegen einen Angriff (Tempo hilft) – klappt es, geht alles daneben, sonst ×${f} Schaden.</span></div>
        <div><span>✨</span><span><b>Effekte</b> wirken ab der nächsten Runde und stehen als Plakette im Infokasten.</span></div>
        <div><span>🤝</span><span><b>Reihenfolge:</b> Wer zuletzt gewählt hat, wählt in der nächsten Runde zuerst – so wandert das Handy nur einmal pro Runde.</span></div>
        <div><span>🔄</span><span><b>Wechseln</b> kostet die Runde. Die neue Figur steckt den Angriff dieser Runde ein – bringt aber einen eigenen vollen Krug mit.</span></div>
        ${R.pegel_ab_runde > 0 && R.pegel_pct > 0 ? `<div><span>📈</span><span><b>Pegel:</b> ab Runde ${R.pegel_ab_runde} macht jeder Treffer jede Runde +${R.pegel_pct} % mehr Schaden (höchstens +${R.pegel_max ?? 100} %). Ewig abwarten lohnt sich nicht.</span></div>` : ''}
        <div><span>🎲</span><span><b>Würfel:</b> 75 % heißt beim W20 „6 oder höher“. Die Leiste zeigt grün, welche Zahlen reichen.</span></div>
      </div>
      <button class="btn" id="hclose">Verstanden</button>`).querySelector('#hclose').onclick = closeSheet;
  }

  function roundBar(s, extra) {
    return `<div class="roundbar"><div class="round"><span class="disp">RUNDE ${s.runde}</span><span class="small muted">${extra || `von max. ${s.maxRunden}`}${K.pegel && K.pegel(s) > 0 ? ` · 📈 Pegel +${K.pegel(s)} % Schaden` : ''}</span></div>
      <div class="bar" aria-hidden="true"><div style="width:${Math.min(100, Math.round((s.runde - 1) / s.maxRunden * 100))}%"></div></div></div>`;
  }
  const hitbar = (chance) => {
    const n = K.need(chance);
    return `<span class="hitbar"><span class="segs" aria-hidden="true">${Array.from({ length: 20 }, (_, i) => `<i class="${i + 1 >= n ? 'g' : ''}"></i>`).join('')}</span>${chance >= 100 ? 'sicher' : `${chance} %`}</span>`;
  };

  function meter(now, after, max) {
    const pct = (v) => Math.round(v / max * 100), lo = Math.min(now, after), hi = Math.max(now, after);
    return `<i style="width:${pct(lo)}%"></i>${hi > lo ? `<i class="cost" style="left:${pct(lo)}%;width:${pct(hi - lo)}%"></i>` : ''}`;
  }

  // Wählen in zwei Schritten: erst Kategorie (F.cat), dann Aktion daraus
  function renderPick() {
    const s = F.s, side = F.side, f = K.aktiv(s, side), o = K.optionen(s, side);
    const sel = (a) => F.choice && F.choice.typ === a.typ && F.choice.i === a.i;
    const chosenA = F.choice && F.choice.typ === 'aktion' ? f.aktionen[F.choice.i] : null;
    const delta = !chosenA ? 0 : chosenA.kat === 'auftanken' ? chosenA.kosten - Math.round(K.erwartung(chosenA).ev) : chosenA.kosten;
    const max = f.noertenMax, now = f.noerten, after = Math.max(0, Math.min(max, now - delta));
    const chosen = F.choice ? actLabel(s, side, F.choice) : null;
    const first = s.runde === 1 && side === 'A';
    const sw = F.choice && F.choice.typ === 'wechseln' ? s.teams[side].figs[F.choice.i] : null;
    const cat = F.cat && (F.cat === 'wechseln' || o.aktionen.some((x) => x.a.kat === F.cat)) ? F.cat : null;

    // Aktionskarte mit allen Werten (Liste in einer Kategorie, und als Vorschau der Wahl)
    const acard = ({ i, a, ok, chance }, show) => {
      const b = big(a, chance), det = details(a);
      const showBar = a.kat === 'ausweichen' || chance < 100;
      const tank = a.kat === 'auftanken';
      const tag = show ? 'div' : 'button';
      return `<${tag} class="acard" ${show ? '' : `data-a='{"typ":"aktion","i":${i}}'`} aria-pressed="${show || sel({ typ: 'aktion', i })}" ${ok || show ? '' : 'disabled'}>
        <span class="big ${b.cls || ''}"><b class="${b.v.length > 6 ? 'xs' : b.v.length > 3 ? 'sm' : ''}">${esc(b.v)}</b><small>${b.u}</small></span>
        <span class="mid"><b>${esc(a.name)}</b>${showBar ? hitbar(chance) : '<span class="extra">sicher</span>'}
          ${det.map((d) => `<span class="extra">${esc(d)}</span>`).join('')}${ok ? '' : `<span class="why">Zu wenig Nörten – erst auftanken</span>`}</span>
        <span class="cost ${tank && !a.kosten ? 'free' : ''}"><span>${a.kosten ? '−' + a.kosten : tank ? '+' : '0'}</span><small>🍺</small></span></${tag}>`;
    };
    let body;
    if (!cat) {   // Kategorien. Hat eine Kategorie nur eine Aktion, wählt die Kachel sie direkt.
      const tiles = K.KAT.map((k) => {
        const list = o.aktionen.filter((x) => x.a.kat === k), okN = list.filter((x) => x.ok).length;
        const pressed = chosenA && chosenA.kat === k;
        const style = `style="--kc:${KAT_UI[k].c}"`, dis = okN ? '' : 'disabled';
        const head = `<span class="ki">${KAT_UI[k].icon}</span><b>${KAT_UI[k].name}</b>`;
        const tail = `${okN ? '' : '<span class="why">Zu wenig Nörten</span>'}${vsRow(k)}`;
        if (list.length === 1) {
          const x = list[0], b = big(x.a, x.chance), tank = k === 'auftanken';
          const odds = k === 'ausweichen' ? '' : x.chance < 100 ? `${x.chance} %` : 'sicher';
          const cost = x.a.kosten ? `−${x.a.kosten} 🍺` : tank ? '' : 'kostet nichts';
          return `<button class="ktile" data-a='{"typ":"aktion","i":${x.i}}' ${style} aria-pressed="${!!pressed}" ${dis}>${head}
            <span class="kn">${esc(x.a.name)}</span>
            <span class="kv"><strong>${esc(b.v)}</strong><small>${esc(b.u.toLowerCase())}${odds ? ' · ' + odds : ''}</small></span>
            ${cost ? `<span class="kc">${cost}</span>` : ''}${tail}</button>`;
        }
        const cheapest = list.length ? Math.min(...list.map((x) => x.a.kosten)) : 0;
        return `<button class="ktile" data-cat="${k}" ${style} aria-pressed="${!!pressed}" ${dis}>${head}<span class="more">${list.length} ›</span>
          <span class="kn">${pressed ? `✓ ${esc(chosenA.name)}` : `${list.length} Aktionen zur Wahl${cheapest ? ` · ab ${cheapest} 🍺` : ''}`}</span>${tail}</button>`;
      }).join('');
      const chosenO = chosenA && o.aktionen.find((x) => x.i === F.choice.i);
      body = `<div class="sec-h"><span>WAS SOLL ${esc(f.name.toUpperCase())} TUN?</span></div>
        <div class="ktiles">${tiles}</div>
        <button class="swbtn" id="sw" aria-pressed="${!!sw}" ${o.wechseln.length ? '' : 'disabled'}>🔄 ${sw ? `Wechsel zu <b>${esc(sw.name)}</b>` : o.wechseln.length ? `Auswechseln · ${o.wechseln.length} auf der Bank` : 'Auswechseln · niemand auf der Bank'}</button>
        ${chosenO ? `<div class="picked"><div class="sec-h"><span>GEWÄHLT</span></div>${acard(chosenO, true)}</div>` : ''}`;
    } else {      // Kategorie mit mehreren Aktionen: Aktion wählen
      const cards = o.aktionen.filter((x) => x.a.kat === cat).map((x) => acard(x, false)).join('');
      body = `<div class="sec-h"><span>${KAT_UI[cat].icon} ${KAT_UI[cat].name.toUpperCase()}</span></div>
        <button class="back" id="back">← andere Kategorie</button>
        ${vsRow(cat)}<div class="actlist">${cards}</div>`;
    }

    app.innerHTML = `<div class="pickhead"><span class="tchip t${side}" style="background:var(--t${side})">${esc(s.teams[side].name.toUpperCase())} WÄHLT</span>
        <span class="small muted" style="flex:1;text-align:right">Runde ${s.runde} / ${s.maxRunden}</span>
        <button class="help" id="help" aria-label="Wer schlägt wen? Regeln anzeigen">?</button></div>
      ${stage(s, side, chosen ? { [side]: bubbleText(chosen) } : null, true)}
      <div class="tank" aria-label="Nörten von ${esc(f.name)}: ${now} von ${max}">
        ${mug(after, max, 22)}<span class="meter">${meter(now, after, max)}</span>
        <b>${after === now ? `${now} Nörten` : `${now} → ${after}${delta < 0 ? ' (Ø)' : ''}`}</b></div>
      ${first ? `<p class="small" style="margin:0;text-align:center">Neu hier? <a href="#" id="help2">So funktioniert „Wer schlägt wen“</a></p>` : ''}
      ${body}
      ${chosen ? `<div class="sticky confirm"><button class="btn-main" id="lock">${esc(chosen.t.replace(/^\p{Extended_Pictographic}️?\s*/u, '').toUpperCase())} FESTLEGEN<small>${side === firstSide(s) ? `danach ist ${esc(s.teams[other(side)].name)} dran` : 'danach wird aufgedeckt'}</small></button></div>` : ''}`;
    const rerender = () => { const y = scrollY; renderPick(); scrollTo(0, y); };
    app.querySelector('#help').onclick = helpSheet;
    const h2 = app.querySelector('#help2'); if (h2) h2.onclick = (e) => { e.preventDefault(); helpSheet(); };
    app.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => {
      F.cat = b.dataset.cat;
      const ok = o.aktionen.filter((x) => x.a.kat === F.cat && x.ok);
      if (ok.length === 1) F.choice = { typ: 'aktion', i: ok[0].i };          // nur eine Aktion: gleich vorwählen
      else if (!(chosenA && chosenA.kat === F.cat)) F.choice = null;
      saveF(); rerender();
    });
    const bk = app.querySelector('#back'); if (bk) bk.onclick = () => { F.cat = null; saveF(); rerender(); };
    app.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { F.choice = JSON.parse(b.dataset.a); saveF(); rerender(); });
    const swb = app.querySelector('#sw'); if (swb) swb.onclick = () => {
      const el = sheet(`<h2>Wen einwechseln?</h2><div class="pick-list">${o.wechseln.map((w) => { const b = s.teams[side].figs[w.i];
        return `<button data-i="${w.i}"><span class="thumb hatch">${thumb(b)}</span><span><b>${esc(b.name)}</b><br><span class="small muted">${b.lp}/${b.lpMax} LP · ${b.noerten} Nörten</span></span></button>`; }).join('')}</div>
        <p class="small muted" style="margin:0">Der Wechsel passiert zuerst – die neue Figur steckt einen Angriff dieser Runde ein.</p>`);
