      el.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => { F.choice = { typ: 'wechseln', i: +b.dataset.i }; closeSheet(); const y = scrollY; renderPick(); scrollTo(0, y); });
    };
    const lock = app.querySelector('#lock'); if (lock) lock.onclick = () => {
      if (!K.gueltig(s, side, F.choice)) { toast('Diese Aktion geht gerade nicht.', 'err'); return; }
      F.pending[side] = F.choice; F.choice = null; F.cat = null;
      if (side === firstSide(s)) { F.side = other(side); F.phase = 'hand'; F.undo = Date.now() + 5000; }   // 5 s „Doch anders“
      else F.phase = 'count';                                                             // Countdown, dann Aufdecken
      saveF(); render();
    };
  }

  // Wahl zurücknehmen: zurück ins Wählen, die alte Wahl ist vorausgewählt
  function undoPick(side) {
    F.choice = F.pending[side]; delete F.pending[side]; F.undo = null;
    F.side = side; F.phase = 'pick'; F.cat = null; saveF(); render();
  }

  // Beide haben gewählt: kurzer Countdown (Spannung + letzte Chance zum Ändern), dann aufdecken
  function renderCount() {
    let n = 3;
    const zweiter = other(firstSide(F.s)), t = F.s.teams[zweiter].name;
    app.innerHTML = `${roundBar(F.s, 'Beide haben gewählt')}
      <div class="count3 card ink"><p style="margin:0"><b>Aufdecken in</b></p><div class="num" id="n" aria-live="polite">${n}</div>
        <button class="btn-main" id="now">JETZT AUFDECKEN</button></div>
      <div class="undo"><span>${esc(t)}: Wahl gespeichert</span><button id="undo">↩ Doch anders</button></div>`;
    const tick = () => { n--; if (n <= 0) { resolve(); return; } const el = app.querySelector('#n'); el.textContent = n; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; timer = setTimeout(tick, 900 / speed); };
    timer = setTimeout(tick, 900 / speed);
    app.querySelector('#now').onclick = resolve;
    app.querySelector('#undo').onclick = () => undoPick(zweiter);
  }

  function resolve() {
    const before = JSON.parse(JSON.stringify(F.s));
    const acts = { A: F.pending.A, B: F.pending.B };
    const labels = { A: actLabel(before, 'A', acts.A), B: actLabel(before, 'B', acts.B) };
    const ev = K.runde(F.s, acts.A, acts.B);
    F.last = { before, ev, labels, acts, runde: before.runde }; F.pending = {}; F.phase = 'reveal'; F.played = false;
    saveF(); render();
  }

  // ---------- Aufdecken: Runde Schritt für Schritt abspielen ----------
  async function renderReveal() {
    const { before, ev, labels, runde } = F.last;
    const d = JSON.parse(JSON.stringify(F.played ? F.s : before));
    const bub = F.played ? null : { A: bubbleText(labels.A), B: bubbleText(labels.B) };
    const acts = F.last.acts || {};
    const vd = acts.A && acts.B ? verdict(d.regeln, labels.A.kat, labels.B.kat) : '';
    const ch = (x) => `<div class="choice t${x}"><span class="who">${esc(d.teams[x].name)}</span><b>${esc(labels[x].t)}</b>${labels[x].d ? `<span class="d">${esc(labels[x].d)}</span>` : ''}</div>`;
    app.innerHTML = `${roundBar({ runde, maxRunden: d.maxRunden, regeln: d.regeln, groesse: d.groesse }, 'Aufdecken!')}
      <div class="reveal2">${ch('A')}<span class="vs">VS</span>${ch('B')}</div>${vd ? `<div class="verdict">${esc(vd)}</div>` : ''}
      ${stage(d, 'A', bub).replace('class="stage ', 'class="stage mid ')}
      <div class="dialog" id="dlg" aria-live="polite"></div>
      <div class="actions" style="gap:0"><button class="btn-main" id="next" ${F.played ? '' : 'disabled'}>WEITER</button>
      <div class="revbar">${F.played ? '<span></span>' : '<button class="skip" id="skip">Animation überspringen</button>'}
        <button class="tempo" id="tempo" aria-pressed="${speed === 2}" aria-label="Animationstempo, gerade ${speed}-fach">Tempo ${speed}×</button></div></div>`;
    const $ = (q) => app.querySelector(q), dlg = $('#dlg'), fx = $('#fx'), next = $('#next');
    const say = (html, more) => { dlg.innerHTML = html + (more ? '<span class="more">▼</span>' : ''); };
    $('#next').onclick = () => { if (F.played) after(); };
    $('#tempo').onclick = (e) => {
      speed = speed === 2 ? 1 : 2; try { localStorage.setItem(TEMPO, String(speed)); } catch {}
      e.currentTarget.textContent = `Tempo ${speed}×`; e.currentTarget.setAttribute('aria-pressed', String(speed === 2));
    };
    // Ist die Runde fertig abgespielt, geht ein Tipp auf Textkasten oder Bühne zur nächsten Runde
    const done = () => { if (F.played) after(); };
    if (F.played) { say(`Runde ${runde} ist vorbei. Tippen für weiter.`, true); dlg.onclick = done; $('#stage').onclick = done; return; }

    let skip = false, tapR = null;
    const tap = () => { if (F.played) return done(); if (tapR) { const r = tapR; tapR = null; r(); } };
    dlg.onclick = tap; $('#stage').onclick = tap;
    $('#skip').onclick = () => { skip = true; tap(); };
    const pause = (ms) => (skip ? Promise.resolve() : new Promise((r) => { tapR = r; setTimeout(() => { if (tapR === r) tapR = null; r(); }, REDUCED ? Math.min(ms, 400) : ms / speed); }));
    const spin = (ms) => new Promise((r) => setTimeout(r, ms / speed));
    const figEl = (side) => app.querySelector(`.fig[data-side="${side}"]`);
    const spriteEl = (side) => figEl(side).querySelector('.sprite');
    const anim = (side, cls) => { if (skip) return; const sp = spriteEl(side); sp.classList.remove(cls); void sp.offsetWidth; sp.classList.add(cls); setTimeout(() => sp.classList.remove(cls), 900); };
    const float = (side, text, cls, where) => {
      if (skip) return;
      const host = where === 'box' ? app.querySelector(`.ibox[data-side="${side}"]`) : figEl(side);
      const el = document.createElement('div'); el.className = 'float ' + cls; el.textContent = text;
      el.style.left = where === 'box' ? 'auto' : '50%'; el.style.right = where === 'box' ? '6px' : 'auto'; el.style.top = where === 'box' ? '-10px' : '10%';
      if (where !== 'box') el.style.marginLeft = '-30px';
      host.appendChild(el); setTimeout(() => el.remove(), 1200);
    };
    const stamp = (text, cls) => { if (skip) return; const el = document.createElement('div'); el.className = 'stamp ' + (cls || ''); el.textContent = text; fx.appendChild(el); setTimeout(() => el.remove(), 950); };
    const box = (side) => {
      const el = app.querySelector(`.ibox[data-side="${side}"]`), old = el.querySelector('.lpfill').style.width;
      el.innerHTML = ibox(d, side);
      const fill = el.querySelector('.lpfill'), nw = fill.style.width;
      if (!skip) { fill.style.width = old; requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = nw; })); }
    };
    const syncMods = () => { for (const x of ['A', 'B']) d.teams[x].figs.forEach((f, i) => { f.fx = JSON.parse(JSON.stringify(F.s.teams[x].figs[i].fx)); }); };
    const who = (side) => K.aktiv(d, side).name;

    async function dice(e) {
      const strip = Array.from({ length: 20 }, (_, i) => `<i class="${i + 1 >= e.need ? 'g' : ''}" data-n="${i + 1}">${i + 1}</i>`).join('');
      fx.innerHTML = `<div class="dicebox"><div class="dlabel">${esc(who(e.side))} würfelt<b>${esc(e.label)}</b></div>
        <div class="die roll">${D20}<span>?</span></div><div class="strip">${strip}</div>
        <div class="dtext">Grün = geschafft · braucht <b>${e.need}+</b> (${e.chance} %)</div></div>`;
      const die = fx.querySelector('.die'), num = die.querySelector('span'), cells = fx.querySelectorAll('.strip i'), txt = fx.querySelector('.dtext');
      if (!skip && !REDUCED) for (let k = 0; k < 9 && !skip; k++) {
        const n = 1 + Math.floor(Math.random() * 20); num.textContent = n;
        cells.forEach((c) => c.classList.toggle('cur', +c.dataset.n === n));
        await spin(40 + k * 7);
      }
      cells.forEach((c) => c.classList.remove('cur'));
      die.classList.remove('roll'); die.classList.add('land', e.ok ? 'ok' : 'fail'); num.textContent = e.roll;
      cells[e.roll - 1].classList.add('res');
      txt.innerHTML = `<b>${e.roll}</b> ${e.ok ? '≥' : '<'} ${e.need} → <b>${e.ok ? 'geschafft!' : 'nicht geschafft!'}</b>`;
      await pause(950);
      fx.innerHTML = '';
    }

    // Glücksrad: Felder nach Anteil, Zeiger läuft und bleibt auf dem Ergebnis stehen
    async function wheel(e) {
      const tot = e.ausgaenge.reduce((x, o) => x + Math.max(0, o.anteil), 0) || 1;
      fx.innerHTML = `<div class="dicebox"><div class="dlabel">${esc(who(e.side))} dreht das Glücksrad<b>${esc(e.label)}</b></div>
        <div class="wheel">${e.ausgaenge.map((o, i) => `<i data-i="${i}" style="flex:${Math.max(0.001, o.anteil)}"><b>${o.wert}</b><small>${Math.round(o.anteil / tot * 100)} %</small></i>`).join('')}</div>
        <div class="dtext">…</div></div>`;
      const cells = fx.querySelectorAll('.wheel i'), txt = fx.querySelector('.dtext');
      if (!skip && !REDUCED) for (let k = 0; k < 9 && !skip; k++) {
        cells.forEach((c, i) => c.classList.toggle('cur', i === k % cells.length));
        await spin(50 + k * 9);
      }
      cells.forEach((c, i) => { c.classList.remove('cur'); c.classList.toggle('res', i === e.i); });
      txt.innerHTML = `Ergebnis: <b>${e.wert}</b>`;
      await pause(850);
      fx.innerHTML = '';
    }

    say(`<b>Aufgedeckt!</b> ${esc(labels.A.t)} gegen ${esc(labels.B.t)}.`, true);
    for (const x of ['A', 'B']) if (labels[x].kat === 'verteidigung') spriteEl(x).classList.add('guard');
    await pause(1600);

    for (const e of ev) {
      const f = e.fi != null ? d.teams[e.side].figs[e.fi] : null;
      if (e.t === 'noerten') {
        const delta = e.value - f.noerten; f.noerten = e.value; box(e.side);
        if (delta) float(e.side, `${delta > 0 ? '+' : '−'}${Math.abs(delta)} 🍺`, 'beer', 'box');
        if (delta > 0) { say(esc(e.text), true); await pause(1200); } else await pause(380);
      } else if (e.t === 'wechsel') {
        say(esc(e.text), true);
        if (!skip) { spriteEl(e.side).classList.add('out'); await pause(380); }
        d.teams[e.side].active = e.fi;
        figEl(e.side).querySelector('.sprite').outerHTML = sprite(K.aktiv(d, e.side)); box(e.side);
        await pause(1000);
      } else if (e.t === 'angriff') {
        say(esc(e.text), true); anim(e.side, 'lunge'); await pause(900);
      } else if (e.t === 'wurf') {
        if (e.chance < 100) await dice(e);
        if (e.kat === 'ausweichen') { if (e.ok) { anim(e.side, 'dodge'); stamp('AUSGEWICHEN!', 'good'); } else stamp('ERWISCHT!', 'bad'); }
        else if (e.kat === 'verteidigung') stamp(e.ok ? 'ABGEWEHRT!' : 'DURCH!', e.ok ? 'good' : 'bad');
        else if (e.kat === 'auftanken') stamp(e.ok ? 'PROST!' : 'VERSCHÜTTET!', e.ok ? 'good' : 'bad');
        else stamp(e.ok ? 'TREFFER!' : 'DANEBEN!', e.ok ? 'good' : 'bad');
        say(esc(e.text), true); await pause(600);
      } else if (e.t === 'rad') {
        await wheel(e);
        say(`${esc(e.label)}: <b>${e.wert}</b>!`, true); await pause(550);
      } else if (e.t === 'lp') {
        const diff = e.value - f.lp; f.lp = e.value; box(e.side);
        if (diff < 0) { anim(e.side, 'hit'); float(e.side, `−${-diff}`, 'dmg'); if (!skip) buzz(diff <= -20 ? 90 : 40); } else if (diff > 0) { anim(e.side, 'heal'); float(e.side, `+${diff}`, 'heal'); }
        say(esc(e.text), true); await pause(1100);
      } else if (e.t === 'effekt' || e.t === 'konter') {
        syncMods(); box('A'); box('B');
        if (e.t === 'konter') stamp('KONTER!', 'gold'); else float(e.side, '✨', 'info');
        say(esc(e.text), true); await pause(1300);
      } else if (e.t === 'ko') {
        f.ko = true; f.lp = 0; box(e.side); spriteEl(e.side).classList.add('koed'); stamp('K.O.!', 'bad'); if (!skip) buzz([80, 60, 180]);
        say(esc(e.text), true); await pause(1500);
      } else if (e.t === 'ende') {
        say(`<b>${esc(e.text)}</b>`, false); await pause(800);
      } else if (e.text) {
        say(esc(e.text), true); await pause(1100);
      }
    }
    app.querySelectorAll('.sprite.guard').forEach((x) => x.classList.remove('guard'));
    fx.innerHTML = '';
    F.played = true; saveF();
    // Endstand sicher anzeigen
    for (const x of ['A', 'B']) { d.teams[x] = JSON.parse(JSON.stringify(F.s.teams[x])); box(x); }
    if (!ev.some((e) => e.t === 'ende')) say(`Runde ${runde} ist vorbei. Weiter zu Runde ${F.s.runde}!`, true);
    next.disabled = false; const sk = $('#skip'); if (sk) sk.remove();
  }

  function after() {
    const s = F.s;
    if (s.over) { F.phase = 'ende'; }
    else if (s.needSwitch.length) { F.phase = 'ersetzen'; F.side = s.needSwitch[0]; }
    else { F.phase = 'hand'; F.side = firstSide(s); }
    saveF(); render();
  }

  function renderErsetzen() {
    const s = F.s, side = F.side, t = s.teams[side];
    app.innerHTML = `<div class="round"><span class="disp">K.O.!</span></div>
      <div class="card ink actions"><h2>${esc(t.name)}: Wer kommt rein?</h2><p class="small muted" style="margin:0">${esc(K.aktiv(s, side).name)} ist k.o. Der Ersatz kostet nichts.</p>
      <div class="pick-list">${K.bank(s, side).map(({ f, i }) => `<button data-i="${i}"><span class="thumb hatch">${thumb(f)}</span>
        <span><b>${esc(f.name)}</b><br><span class="small muted">${f.lp}/${f.lpMax} LP · ${f.noerten} Nörten</span></span></button>`).join('')}</div></div>`;
    app.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => { K.ersetzen(s, side, +b.dataset.i); after(); });
  }

  // Was die neuen Level laut Level-Pfad bringen
  function unlocks(typeId, from, to) {
    const t = game.data.typen[typeId], out = [];
    for (let lv = from + 1; lv <= to; lv++) {
      const opts = (t && t.pfad && t.pfad[lv]) || [];
      if (opts.length === 1) out.push(`Level ${lv}: <b>${esc(K.optionText(t, opts[0]))}</b>`);
      else if (opts.length > 1) out.push(`Level ${lv}: Wahl – ${opts.map((o) => esc(K.optionText(t, o))).join(' <i>oder</i> ')}`);
    }
    return out;
  }
  // Einträge zum Melden: live nur, wenn gescannt und der Scan höchstens 2 Stunden alt ist (Revanche zählt mit)
  function meldeListe(side) {
    const en = F.setup.entries;
    if (!en) return F.serials[side].map((s) => ({ s }));            // Kampf aus der Zeit vor Nachtrag 008
    return en[side].map((e) => (e.s && Date.now() - e.liveAt < Noerti.LIVE_TTL ? { s: e.s } : { p: e.p }));
  }
  function xpRechnung(x) {
    const parts = [];
    parts.push(`${F.s.winner == null ? 'Unentschieden' : F.s.winner === x.side ? 'Sieg' : 'Niederlage'} <b>${x.base ?? ''}</b>`);
    if (x.bonus) parts.push(`neuer Freund <b>+${x.bonus}</b>`);
    if (x.live === false) parts.push('📋 Sammlung <b>½</b>');
    if (x.starter) parts.push('⭐ Starter <b>×2</b>');
    return x.base == null ? '' : `<div class="xpcalc">${parts.map((p) => `<span>${p}</span>`).join('')}</div>`;
  }
  function xpBlock() {
    const r = F.report;
    if (!r) return '<div class="card"><div class="spinner" style="margin:10px auto"></div><p class="small muted" style="margin:0;text-align:center">Ergebnis wird gespeichert …</p></div>';
    if (r.error) return `<div class="card actions"><p class="warn" style="margin:0">Ergebnis nicht gespeichert: ${esc(r.error)}</p><button class="btn" id="retry">Nochmal versuchen</button></div>`;
    const b = r.bilanz && F.setup.spieler && F.setup.spieler.A && F.setup.spieler.B
      ? `<div class="card bilanz">${esc(F.setup.spieler.A)} ${r.bilanz.A} : ${r.bilanz.B} ${esc(F.setup.spieler.B)}${r.bilanz.u ? `<div class="small muted" style="font-family:var(--body)">${r.bilanz.u} × unentschieden</div>` : ''}</div>` : '';
    return b + ['A', 'B'].map((side) => `<section class="card actions" style="gap:10px"><b>${esc(F.s.teams[side].name)}</b>${F.s.teams[side].figs.map((f, fi) => {
      const x = r.figures.find((y) => y.public_id === f.key); if (!x) return '';
      const li = Noerti.levelInfo(x.xp, x.level), up = x.level > x.level_before;
      const ul = up ? unlocks(f.type_id, x.level_before, x.level) : [];
      const sf = F.setup[side].figs[fi], off = sf ? offen({ type_id: sf.type_id, level: x.level, wahlen: sf.wahlen }) : [];
      return `<div class="actions" style="gap:4px">
        <div class="nm" style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span>${f.ko ? '💤' : '💪'}</span><b style="flex:1">${esc(f.name)}</b>
          ${x.starter ? '<span class="chip stern">⭐</span>' : ''}${x.live === false ? '<span class="chip samm">📋</span>' : x.live ? '<span class="chip live">📡 LIVE</span>' : ''}
          <span class="disp" style="font-size:15px">${x.rated ? `+${x.xp_gain} XP` : 'keine XP'}</span></div>
        ${x.rated ? xpRechnung(x) : ''}
        ${x.live === false ? '<span class="small muted">Beim nächsten Mal scannen: doppelte XP und ein Eintrag im Freundebuch.</span>' : ''}
        ${x.rated ? '' : '<span class="small muted">Heute schon 3× gegen diese Gegner gekämpft.</span>'}
        <div class="bar"><div class="xpfill" style="width:${li.pct}%;background:var(--marker)"></div></div>
        <span class="small muted">LV ${x.level} · ${esc(li.text)}</span>
        ${up ? `<div class="lvup"><b>⬆ LEVEL UP! ${x.level_before} → ${x.level}</b>${ul.map((u) => `<span>✨ ${u}</span>`).join('')}</div>` : ''}
        ${off.length && F.serials[side][fi] ? `<button class="reward big" data-rw="${side}${fi}">⭐ ${off.length === 1 ? 'Belohnung' : off.length + ' Belohnungen'} wählen</button>` : ''}
      </div>`; }).join('')}</section>`).join('');
  }
  async function sendReport() {
    const s = F.s;
    try {
      const m = { id: F.id, a: meldeListe('A'), b: meldeListe('B'), winner: s.winner, rounds: Math.max(1, s.runde - 1), reason: s.grund || 'ko', spieler: F.setup.spieler || null,
        log: { history: s.history, teams: ['A', 'B'].map((x) => s.teams[x].figs.map((f) => ({ type: f.type_id, level: f.level, lp: f.lp, ko: f.ko }))) }, version: F.version || null };
      let r;
      try { r = await api.reportMatch2(m); }
      catch (e) {   // Nachtrag 008 noch nicht ausgeführt: alte Meldung (nur mit Seriennummern möglich)
        if (!/function|schema cache/i.test(errMsg(e))) throw e;
        if ([...F.serials.A, ...F.serials.B].some((x) => !x)) throw new Error('Figuren aus fremden Sammlungen brauchen SQL-Nachtrag 008 in Supabase.');
        r = await api.reportMatch({ ...m, a: F.serials.A, b: F.serials.B });
      }
      F.report = { figures: r.figures, bilanz: r.bilanz || null };
      // neue Level für Revanche und Aufstellung übernehmen
      const lv = Object.fromEntries(r.figures.map((x) => [x.public_id, x.level]));
      for (const side of ['A', 'B']) F.setup[side].figs.forEach((f) => { if (lv[f.key]) f.level = lv[f.key]; });
      const l = lobby.load(); for (const side of ['A', 'B']) l[side].forEach((e) => { if (lv[e.public_id]) e.level = lv[e.public_id]; }); lobby.save(l);
      const la = loadLast(); if (la) { for (const side of ['A', 'B']) la[side].forEach((e) => { if (lv[e.public_id]) e.level = lv[e.public_id]; }); saveLast(la); }
    } catch (e) { F.report = { error: errMsg(e) }; }
    saveF();
    if (F.phase === 'ende') renderEnde();
    if (F.report && F.report.figures && !F.feierGezeigt) { F.feierGezeigt = true; saveF(); await levelFeier(); }
  }
  // Nach dem Melden: Level-up-Fenster für jede Figur, die aufgestiegen ist (Wahlen gleich darin, wenn die Seriennummer bekannt ist)
  async function levelFeier() {
    for (const side of ['A', 'B']) for (const [fi, f] of F.s.teams[side].figs.entries()) {
      const x = F.report.figures.find((y) => y.public_id === f.key), sf = F.setup[side].figs[fi], serial = F.serials[side][fi];
      if (!x || x.level <= x.level_before) continue;
      await Noerti.feier.kette(x.level_before, x.level, { data: game.data, typeId: f.type_id, img: (STD[f.type_id] || {}).url || f.img || '', name: f.name,
        gewaehlt: sf.wahlen || {}, onPick: serial ? async (lv, i) => {
          const res = await api.chooseReward(serial, lv, i); sf.wahlen = (res && res.wahlen) || { ...(sf.wahlen || {}), [lv]: i };
          const l = lobby.load(); for (const e of [...l.A, ...l.B]) if (e.public_id === f.key) e.wahlen = sf.wahlen; lobby.save(l); saveF();
        } : null });
    }
    if (F && F.phase === 'ende') renderEnde();
  }

  function renderEnde() {
    const s = F.s, w = s.winner;
    if (!F.buzzed) { F.buzzed = true; buzz(w ? [60, 40, 60, 40, 220] : 120); }
    app.innerHTML = `<div class="win card ink"><div class="crown">${w ? '🏆' : '🤝'}</div>
        <h1>${w ? esc(s.teams[w].name.toUpperCase()) + ' GEWINNT!' : 'UNENTSCHIEDEN!'}</h1>
        <p class="muted" style="margin:0">${s.grund === 'runden' ? `Nach ${s.runde - 1} Runden zählen die übrigen Lebenspunkte.` : `Nach ${s.runde - 1} Runden.`}</p></div>
      ${xpBlock()}
      <div class="actions"><button class="btn-main" id="again" ${F.report && !F.report.error ? '' : 'disabled'}>REVANCHE</button>
        <button class="btn" id="lobby">Aufstellung ändern</button><a class="btn" href="../bestenliste/">Bestenliste</a></div>`;
    const rt = app.querySelector('#retry'); if (rt) rt.onclick = () => { F.report = null; renderEnde(); };
    app.querySelectorAll('[data-rw]').forEach((b) => b.onclick = () => {
      const side = b.dataset.rw[0], fi = +b.dataset.rw.slice(1), sf = F.setup[side].figs[fi];
      const e = { serial: F.serials[side][fi], type_id: sf.type_id, level: sf.level, wahlen: { ...(sf.wahlen || {}) }, name: sf.name };
      rewardSheet(e, (w) => {
        sf.wahlen = w;
        const l = lobby.load(); for (const x of [...l.A, ...l.B]) if (x.public_id === sf.key) x.wahlen = w; lobby.save(l);
        saveF(); renderEnde();
      });
    });
    app.querySelector('#again').onclick = () => { newFight(F.setup, F.serials); saveF(); render(); };   // Revanche: live bleibt (Scan max. 2 h alt)
    app.querySelector('#lobby').onclick = () => { if (F.report && !F.report.error || confirm('Das Ergebnis ist noch nicht gespeichert. Trotzdem weiter?')) { F = null; saveF(); renderLobby(); } };
    if (!F.report) sendReport();
  }

  function quit() {
    if (!confirm('Kampf wirklich abbrechen?')) return;
    F = null; saveF(); renderLobby();
  }

  function render() {
    clearTimeout(timer); timer = null;
    window.scrollTo(0, 0);
    if (!F) return renderLobby();
    ({ hand: renderHand, pick: renderPick, count: renderCount, reveal: renderReveal, ersetzen: renderErsetzen, ende: renderEnde })[F.phase]();
  }

  // ---------- Start ----------
  try { [types, game, STD] = await Promise.all([Noerti.types(), Noerti.gameData(), Noerti.stdImages()]); }
  catch (e) { app.innerHTML = `<div class="card">Die Arena konnte nicht laden: ${esc(errMsg(e))}</div>`; return; }
  F = loadF();
  if (F && (!F.s || !F.phase || !F.s.maxRunden || !F.id || !F.s.opts)) F = null;   // !opts = Kampf aus v1 → verwerfen
  render();
  window.addEventListener('storage', (e) => { if (e.key === 'noerti-arena-lobby' && !F) renderLobby(); });
})();
</script>
</body>
</html>
