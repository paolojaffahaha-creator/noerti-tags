<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nörti Tag-Writer</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #e3e0da;
    --accent: #2f5fd0; --ok: #1f8a4c; --warn: #b7791f; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --ink: #f1efea; --muted: #a29e96; --line: #33322f;
      --accent: #7aa2ff; --ok: #4cc283; --warn: #e0a84a; --err: #ff6b5b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .banner { border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .modes { display: flex; gap: 6px; margin-bottom: 12px; }
  .modes button { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; }
  .now { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 18px; text-align: center; transition: border-color .2s, background .2s; }
  .now.ok { border-color: var(--ok); } .now.warn { border-color: var(--warn); } .now.err { border-color: var(--err); }
  .now .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .now .id { font-size: 44px; font-weight: 800; letter-spacing: .02em; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .now .name { font-size: 20px; margin-bottom: 10px; }
  .status { min-height: 2.8em; font-size: 15px; }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.err { color: var(--err); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row > * { flex: 1; }
  .progress { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin: 18px 0 6px; }
  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  li:first-child { border-top: 0; }
  li.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  li .fid { font-weight: 700; font-variant-numeric: tabular-nums; width: 2.6em; }
  li .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .chip { font-size: 12px; color: var(--muted); text-align: right; font-family: ui-monospace, monospace; }
  li .chip.ok { color: var(--ok); }
  details { margin-top: 18px; color: var(--muted); font-size: 14px; }
  details .row button { font-size: 14px; }
  code { font-size: 12px; word-break: break-all; }
  #sim { display: none; }
</style>
</head>
<body>
<main>
  <h1>Nörti Tag-Writer</h1>
  <div id="banner" class="banner" hidden></div>

  <div class="modes">
    <button id="mWrite" class="on">Beschreiben</button>
    <button id="mCheck">Prüfen</button>
  </div>

  <section id="now" class="now">
    <div class="label" id="nowLabel">Als Nächstes</div>
    <div class="id" id="nowId">–</div>
    <div class="name" id="nowName"></div>
    <div class="status" id="status">Tippe auf „Start“ und halte dann die Figur ans Handy.</div>
    <button id="start" class="primary" style="width:100%">Start</button>
    <div class="row">
      <button id="prev">◀ Zurück</button>
      <button id="skip">Überspringen ▶</button>
    </div>
    <div class="row" id="sim">
      <button id="simNew">Neuen Tag simulieren</button>
      <button id="simAgain">Letzten Tag nochmal</button>
    </div>
  </section>

  <div class="progress"><span id="prog"></span><span id="active"></span></div>
  <ul id="list"></ul>

  <details>
    <summary>Export &amp; Einstellungen</summary>
    <p>Tag-Inhalt: URL <code id="urlEx"></code> + Datensatz <code>application/vnd.noerti+json</code>.</p>
    <div class="row">
      <button id="copy">UIDs kopieren (CSV)</button>
      <button id="dl">CSV herunterladen</button>
    </div>
    <div class="row"><button id="reset">Fortschritt zurücksetzen</button></div>
  </details>
</main>

<script>
(() => {
  const MIME = 'application/vnd.noerti+json';
  const STORE = 'noerti-tagwriter-v1';
  const $ = (s) => document.querySelector(s);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const SIM = !('NDEFReader' in window);

  let cfg = { baseUrl: '' }, figs = [], log = {};
  let cur = 0, mode = 'write', reader = null, active = false, busy = false;
  let lastWrite = null, overwriteArmed = null, wakeLock = null;
  const simTags = {}; let simLast = null;

  // ---------- Speicher ----------
  const load = () => { try { log = JSON.parse(localStorage.getItem(STORE)) || {}; } catch { log = {}; } };
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(log)); } catch {} };

  // ---------- Tag-Inhalt ----------
  function figUrl(id) {
    const base = cfg.baseUrl || new URL('f/', location.href).href;
    return base.replace(/\/?$/, '/') + '?id=' + encodeURIComponent(id);
  }
  function message(f) {
    return { records: [
      { recordType: 'url', data: figUrl(f.id) },
      { recordType: 'mime', mediaType: MIME, data: enc.encode(JSON.stringify({ id: f.id, v: 1 })) }
    ] };
  }
  function parse(msg) {
    const out = { id: null, url: null, empty: true };
    if (!msg || !msg.records) return out;
    for (const r of msg.records) {
      out.empty = false;
      try {
        if (r.recordType === 'mime' && r.mediaType === MIME) out.id = JSON.parse(dec.decode(r.data)).id || out.id;
        if (r.recordType === 'url' || r.recordType === 'absolute-url') {
          out.url = dec.decode(r.data);
          if (!out.id) { const m = out.url.match(/[?&]id=([^&#]+)/); if (m) out.id = decodeURIComponent(m[1]); }
        }
      } catch {}
    }
    return out;
  }
  const figById = (id) => figs.find((f) => f.id === id);
  const label = (id) => { const f = figById(id); return f ? `${f.id} ${f.name}` : id; };
  const ownerOf = (serial) => Object.keys(log).find((id) => log[id].serial === serial);

  // ---------- Feedback ----------
  function say(kind, text) {
    const s = $('#status'); s.className = 'status ' + (kind || ''); s.textContent = text;
    $('#now').className = 'now ' + (kind || '');
    if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 80 : kind === 'err' ? [200, 80, 200] : kind === 'warn' ? [60, 60, 60] : 0);
  }
  function nextOpen(from) {
    for (let i = from; i < figs.length; i++) if (!log[figs[i].id]) return i;
    for (let i = 0; i < from; i++) if (!log[figs[i].id]) return i;
    return figs.length;
  }

  // ---------- Kern: ein Tag wurde erkannt ----------
  async function onTag(serial, msg) {
    if (busy) return;
    const found = parse(msg);

    if (mode === 'check') {
      const own = ownerOf(serial);
      if (found.id) say('ok', `Das ist ${label(found.id)}.` + (own && own !== found.id ? ` (Achtung: Protokoll sagt ${label(own)})` : ''));
      else say('warn', found.empty ? 'Leerer Tag – noch nicht beschrieben.' : 'Tag hat fremden Inhalt (kein Nörti).');
      $('#nowId').textContent = found.id || '?';
      $('#nowName').textContent = found.id ? (figById(found.id)?.name || '') : 'UID ' + serial;
      return;
    }

    const f = figs[cur];
    if (!f) { say('ok', 'Alle Figuren sind beschrieben. 🎉'); return; }

    // Gleicher Tag direkt nach dem Schreiben → als Kontrolle werten
    if (lastWrite && lastWrite.serial === serial) {
      if (found.id === lastWrite.id && log[lastWrite.id]) {
        log[lastWrite.id].verified = true; save(); render();
        say('ok', `${label(lastWrite.id)} geprüft ✓ – jetzt die nächste Figur (${f.id}) ranhalten.`);
      } else {
        say('warn', `Das ist noch der Tag von ${label(lastWrite.id)}. Nächste Figur (${f.id}) ranhalten.`);
      }
      return;
    }

    // Schutz: Tag gehört schon einer anderen Figur
    const conflict = (found.id && found.id !== f.id) ? found.id : (ownerOf(serial) && ownerOf(serial) !== f.id ? ownerOf(serial) : null);
    if (conflict && overwriteArmed !== serial) {
      overwriteArmed = serial;
      say('warn', `Dieser Tag ist schon ${label(conflict)}. Nochmal ranhalten, um ihn mit ${f.id} zu überschreiben.`);
      return;
    }

    busy = true;
    say('', `Schreibe ${f.id} …`);
    try {
      if (SIM) { simTags[serial] = message(f); await new Promise((r) => setTimeout(r, 250)); }
      else await reader.write(message(f), { overwrite: true });
      for (const id of Object.keys(log)) if (log[id].serial === serial) delete log[id];
      log[f.id] = { serial, time: new Date().toISOString(), verified: false };
      save();
      lastWrite = { serial, id: f.id }; overwriteArmed = null;
      cur = nextOpen(cur + 1);
      render();
      const n = figs[cur];
      say('ok', `${label(f.id)} geschrieben ✓` + (n ? ` – weiter mit ${n.id}.` : ' – alle fertig! 🎉'));
    } catch (e) {
      say('err', 'Schreiben fehlgeschlagen: ' + (e && e.message ? e.message : e) + ' – Figur ruhig halten und nochmal.');
    } finally { busy = false; }
  }

  // ---------- Start ----------
  async function start() {
    if (active) return;
    if (SIM) { active = true; $('#sim').style.display = 'flex'; render(); say('', 'Simulation aktiv – nutze die Buttons unten.'); return; }
    try {
      reader = new NDEFReader();
      await reader.scan();
      reader.onreading = (e) => onTag(e.serialNumber, e.message);
      reader.onreadingerror = () => say('err', 'Tag nicht lesbar – Figur etwas verschieben und nochmal.');
      active = true; render();
      say('', mode === 'write' ? `Bereit. Halte ${figs[cur] ? figs[cur].id : 'die Figur'} ans Handy.` : 'Bereit. Halte eine Figur ans Handy.');
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
    } catch (e) {
      const m = e && e.name === 'NotAllowedError' ? 'NFC-Berechtigung verweigert. In den Seiteneinstellungen erlauben.'
              : e && e.name === 'NotSupportedError' ? 'NFC ist aus oder nicht verfügbar. In den Android-Einstellungen NFC einschalten.'
              : 'NFC-Start fehlgeschlagen: ' + (e && e.message ? e.message : e);
      say('err', m);
    }
  }
  document.addEventListener('visibilitychange', async () => {
    if (active && !SIM && document.visibilityState === 'visible') { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
  });

  // ---------- Darstellung ----------
  function render() {
    const f = figs[cur];
    if (mode === 'write') {
      $('#nowLabel').textContent = f ? 'Als Nächstes' : 'Fertig';
      $('#nowId').textContent = f ? f.id : '✓';
      $('#nowName').textContent = f ? f.name : 'Alle Figuren beschrieben';
    } else {
      $('#nowLabel').textContent = 'Prüfen';
    }
    $('#start').textContent = active ? 'NFC aktiv' : 'Start';
    $('#start').disabled = active;
    $('#prev').disabled = $('#skip').disabled = mode !== 'write';
    $('#mWrite').classList.toggle('on', mode === 'write');
    $('#mCheck').classList.toggle('on', mode === 'check');
    const done = figs.filter((x) => log[x.id]).length;
    $('#prog').textContent = `${done} / ${figs.length} beschrieben`;
    $('#active').textContent = active ? (SIM ? '● Simulation' : '● NFC an') : '○ NFC aus';
    $('#urlEx').textContent = figUrl(f ? f.id : (figs[0] ? figs[0].id : '001'));
    const ul = $('#list'); ul.innerHTML = '';
    figs.forEach((x, i) => {
      const li = document.createElement('li');
      if (i === cur && mode === 'write') li.className = 'cur';
      const e = log[x.id];
      li.innerHTML = `<span class="fid"></span><span class="fname"></span><span class="chip"></span>`;
      li.children[0].textContent = x.id; li.children[1].textContent = x.name;
      const chip = li.children[2];
      if (e) { chip.textContent = (e.verified ? '✓✓ ' : '✓ ') + e.serial.slice(-8); chip.classList.add('ok'); }
      else chip.textContent = 'offen';
      li.onclick = () => { mode = 'write'; cur = i; lastWrite = null; overwriteArmed = null; render(); say('', `Halte ${x.id} ans Handy.`); };
      ul.appendChild(li);
    });
  }

  // ---------- Export ----------
  function csv() {
    const rows = [['id', 'name', 'uid', 'zeit', 'geprueft']];
    for (const f of figs) { const e = log[f.id]; rows.push([f.id, f.name, e ? e.serial : '', e ? e.time : '', e && e.verified ? 'ja' : '']); }
    return rows.map((r) => r.map((c) => /[;"\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c).join(';')).join('\n');
  }

  // ---------- Buttons ----------
  $('#start').onclick = start;
  $('#mWrite').onclick = () => { mode = 'write'; render(); say('', figs[cur] ? `Halte ${figs[cur].id} ans Handy.` : 'Alle Figuren sind beschrieben.'); };
  $('#mCheck').onclick = () => { mode = 'check'; render(); $('#nowId').textContent = '?'; $('#nowName').textContent = ''; say('', active ? 'Halte eine Figur ans Handy.' : 'Erst „Start“ tippen.'); };
  $('#prev').onclick = () => { cur = Math.max(0, cur - 1); lastWrite = null; overwriteArmed = null; render(); say('', `Halte ${figs[cur].id} ans Handy.`); };
  $('#skip').onclick = () => { cur = Math.min(figs.length, cur + 1); lastWrite = null; overwriteArmed = null; render(); say('', figs[cur] ? `Halte ${figs[cur].id} ans Handy.` : 'Ende der Liste.'); };
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(csv()); say('ok', 'CSV kopiert.'); } catch { say('err', 'Kopieren nicht erlaubt – nimm „herunterladen“.'); } };
  $('#dl').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv()], { type: 'text/csv' }));
    a.download = 'noerti-tags.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#reset').onclick = () => { if (confirm('Fortschritt (nur auf diesem Gerät) löschen? Die Tags selbst bleiben beschrieben.')) { log = {}; save(); cur = 0; lastWrite = null; render(); say('', 'Zurückgesetzt.'); } };
  const randSerial = () => Array.from({ length: 7 }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, '0')).join(':');
  $('#simNew').onclick = () => { simLast = randSerial(); onTag(simLast, simTags[simLast]); };
  $('#simAgain').onclick = () => { if (simLast) onTag(simLast, simTags[simLast]); };

  // ---------- Init ----------
  if (SIM) {
    const b = $('#banner'); b.hidden = false;
    b.textContent = 'Web NFC gibt es hier nicht (nur Chrome auf Android, über HTTPS). Diese Ansicht läuft als Simulation zum Ausprobieren.';
  }
  load();
  fetch('figuren.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
    cfg = d; figs = d.figuren || [];
    cur = nextOpen(0); render();
  }).catch(() => say('err', 'figuren.json konnte nicht geladen werden.'));
})();
</script>
</body>
</html>
