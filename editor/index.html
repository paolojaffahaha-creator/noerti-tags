<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nörti Werkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../app/style.css">
<style>
  :root { --atk: #E5484D; --def: #2F6FE4; --eva: #23965A; --tank: #E39A0B; --soft: #F5F6F8; }
  .wrap { max-width: 1120px; padding-bottom: 110px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.05; }
  h2 { margin: 0; font: 400 22px var(--disp); }
  .status { font-size: 13px; color: var(--muted); }
  .status b { color: var(--ink); }
  .status .warn { color: var(--err); font-weight: 700; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button, .chips button { font: 500 14px var(--body); border: 2px solid var(--ink); border-radius: 99px; padding: 6px 14px; background: var(--white); color: var(--ink); cursor: pointer; min-height: 40px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--white); }
  .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }
  .side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--white); border: 2px solid var(--ink); border-radius: 14px; padding: 10px; }
  .side button { font: 500 14.5px var(--body); text-align: left; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 2px solid transparent; border-radius: 10px; background: none; color: var(--ink); cursor: pointer; min-height: 40px; }
  .side button .id { font: 500 12px ui-monospace, Consolas, monospace; color: var(--muted); }
  .side button[aria-pressed="true"] { background: var(--marker); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .side button.empty { color: var(--muted); }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .side { position: static; flex-direction: row; overflow-x: auto; } .side button { white-space: nowrap; } }
  .main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; min-width: 0; }
  label.f input, label.f select, .in { font: 16px var(--body); color: var(--ink); background: var(--white); border: 2px solid var(--ink); border-radius: 10px; padding: 7px 9px; width: 100%; min-height: 40px; min-width: 0; }
  label.f small, .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; min-height: 36px; }
  label.chk input { width: 20px; height: 20px; accent-color: var(--ink); flex: 0 0 auto; }
  .mini { font: 500 14px var(--body); border: 2px solid var(--ink); border-radius: 10px; background: var(--white); color: var(--ink); padding: 5px 11px; min-height: 36px; cursor: pointer; }
  .mini.danger { color: var(--err); border-color: var(--err); }
  .mini:disabled { opacity: .4; cursor: default; }
  .dashed { border: 2px dashed var(--muted); border-radius: 10px; padding: 7px; font: 500 13.5px var(--body); color: var(--muted); background: none; cursor: pointer; width: 100%; min-height: 38px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Kategorien */
  .c-angriff { --c: var(--atk); } .c-verteidigung { --c: var(--def); } .c-ausweichen { --c: var(--eva); } .c-auftanken { --c: var(--tank); }
  .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .cat { border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--white); display: flex; flex-direction: column; }
  .cat > .hd { background: var(--c); color: var(--white); padding: 7px 11px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 2px solid var(--ink); }
  .cat > .hd b { font: 400 16px var(--disp); }
  .cat > .hd span { font-size: 12px; font-weight: 700; }
  .cat .list { padding: 8px; display: flex; flex-direction: column; gap: 7px; }
  .act { border: 2px solid var(--ink); border-radius: 10px; padding: 7px 9px; display: flex; flex-direction: column; gap: 3px; background: var(--white); cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .act:hover { background: var(--soft); }
  .act[aria-pressed="true"] { box-shadow: 4px 4px 0 var(--c); border-color: var(--c); }
  .act .t { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .act .t b { font-weight: 700; overflow-wrap: anywhere; }
  .act .lv { font: 700 11px var(--body); border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 5px; background: var(--marker); white-space: nowrap; }
  .act .lv.no { background: var(--soft); }
  .act .s { font-size: 12.5px; color: var(--muted); }
  .act.later { background: repeating-linear-gradient(135deg, #F4F5F7 0 8px, #ECEEF2 8px 16px); }
  .tplsel { font: 13.5px var(--body); border: 2px dashed var(--muted); border-radius: 10px; padding: 6px; color: var(--muted); background: var(--white); width: 100%; min-height: 38px; }

  /* Aktions-Editor */
  .aed { border: 3px solid var(--c, var(--ink)); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--white); box-shadow: 5px 5px 0 var(--ink); }
  .aed .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .aed .top h2 { color: var(--c); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
  .cols > * { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .block { border: 2px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 9px; }
  .block > .bh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .block > .bh b { font: 700 12px var(--body); letter-spacing: .1em; text-transform: uppercase; }
  .seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
  .seg button { font: 500 13.5px var(--body); padding: 6px 11px; border: 0; border-right: 2px solid var(--ink); background: var(--white); cursor: pointer; color: var(--ink); min-height: 36px; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  .d20 { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
  .d20 span { height: 20px; border: 1.5px solid var(--ink); border-radius: 4px; font: 600 9.5px ui-monospace, Consolas, monospace; display: grid; place-items: center; background: #FBD4CC; color: #8a2a1c; }
  .d20 span.ok { background: #BDEBCB; color: #155c32; }
  .lines { display: flex; flex-direction: column; gap: 6px; }
  .line { display: grid; gap: 6px; align-items: center; grid-template-columns: 1fr 1fr 36px; }
  .line.fx { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)) 36px; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px; }
  .line .in { min-height: 36px; padding: 5px 7px; font-size: 15px; }
  .line .x { border: 2px solid var(--ink); background: var(--white); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; color: var(--ink); }
  .line .x:disabled { opacity: .35; }
  .heads { font-size: 12px; color: var(--muted); }
  .stack { display: flex; height: 24px; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
  .stack div { display: grid; place-items: center; font: 600 11px ui-monospace, Consolas, monospace; border-right: 2px solid var(--ink); white-space: nowrap; overflow: hidden; min-width: 0; }
  .stack div:last-child { border-right: 0; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .summary > div { border: 2px solid var(--ink); border-radius: 10px; padding: 7px 9px; background: var(--soft); }
  .summary b { display: block; font: 400 22px var(--disp); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .summary span { font-size: 12px; color: var(--muted); }
  .pcard { border: 3px solid var(--ink); border-radius: 14px; padding: 9px 11px; display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; background: var(--white); box-shadow: 4px 4px 0 var(--c); }
  .pcard .big { font: 400 24px var(--disp); line-height: 1; text-align: center; color: var(--c); overflow-wrap: anywhere; }
  .pcard .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .pcard .info b { font: 400 17px var(--disp); }
  .mini20 { display: grid; grid-template-columns: repeat(20, 1fr); gap: 1px; max-width: 180px; }
  .mini20 i { height: 6px; border-radius: 1px; background: var(--line); }
  .mini20 i.ok { background: var(--okc); }

  /* Level-Pfad */
  .lvl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1.5px dashed var(--line); }
  .lvl:last-child { border-bottom: 0; }
  .lvbadge { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .lvbadge b { font: 400 18px var(--disp); width: 44px; height: 44px; display: grid; place-items: center; border: 3px solid var(--ink); border-radius: 50%; background: var(--white); }
  .lvbadge.wahl b { background: var(--marker); border-radius: 10px; }
  .lvbadge.leer b { border-style: dashed; color: var(--muted); }
  .lvbadge span { font-size: 11px; color: var(--muted); font-weight: 700; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .opt { border: 2px solid var(--ink); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: var(--white); }
  .opt .oh { display: flex; justify-content: space-between; align-items: center; gap: 6px; font: 700 11px var(--body); color: var(--muted); letter-spacing: .05em; }
  .opt .txt { font-size: 13.5px; font-weight: 500; }
  .opt .in { min-height: 36px; padding: 5px 7px; font-size: 14.5px; }
  .warnbox { border: 2px solid var(--err); background: #FDECEA; border-radius: 12px; padding: 8px 12px; font-size: 14px; }
  .warnbox ul { margin: 4px 0 0; padding-left: 18px; }
  .sumrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .sumrow span { border: 2px solid var(--ink); border-radius: 10px; padding: 4px 10px; background: var(--white); font-size: 13.5px; }
  .sumrow b { font-family: var(--disp); font-weight: 400; }

  /* Tabellen */
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--white); }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 700; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; border: 2px solid var(--ink); border-radius: 12px; }
  .heat td.n { font-weight: 700; }
  .eff-low { color: var(--err); } .eff-high { color: var(--okc); }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--white); border-top: 3px solid var(--ink);
    padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .savebar .in2 { max-width: 1120px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .savebar .btn-main { flex: 0 1 320px; min-height: 50px; font-size: 17px; box-shadow: 3px 3px 0 var(--ink); }
  .savebar .btn { width: auto; flex: 0 0 auto; }
  .savebar .hint { font-size: 13px; color: var(--muted); flex: 1; }
  .ver { display: flex; gap: 10px; align-items: center; }
  .ver div { flex: 1; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="../">NÖRTI ARENA</a>
    <span class="row"><a class="pill" href="../arena/">Arena</a><a class="pill" href="../">Tag-Writer</a></span>
  </header>
  <div>
    <h1 class="disp">NÖRTI WERKSTATT</h1>
    <div class="status" id="status">Lädt …</div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="figuren" aria-selected="true">Figuren &amp; Aktionen</button>
    <button role="tab" data-tab="pfad">Level-Pfad</button>
    <button role="tab" data-tab="balance">Balance-Test</button>
    <button role="tab" data-tab="regeln">Kampfregeln</button>
    <button role="tab" data-tab="versionen">Versionen</button>
  </nav>
  <div id="root"><div class="spinner" aria-label="Lädt"></div></div>
</div>
<div class="savebar"><div class="in2">
  <span class="hint" id="saveHint">Keine Änderungen</span>
  <button class="btn" id="discard" hidden>Verwerfen</button>
  <button class="btn-main" id="save" disabled>Speichern</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../app/common.js"></script>
<script src="../app/kampf.js"></script>
<script>
(() => {
  const N = window.Noerti, K = window.NoertiKampf, { esc } = N;
  const $ = (q, el = document) => el.querySelector(q);
  const PIN_STORE = 'noerti-tagwriter-pin', DRAFT = 'noerti-editor-draft-v2', TAB = 'noerti-editor-tab';
  const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

  const KAT = {
    angriff:      { label: 'Angriff',      unit: 'Schaden',          big: (a) => bigNum(a, '') },
    verteidigung: { label: 'Verteidigung', unit: 'Reduktion %',      big: (a) => a.sonder.schild ? bigNum(a, '', ' ⛨') : '−' + bigNum(a, '', '%') },
    ausweichen:   { label: 'Ausweichen',   unit: '',                 big: (a) => a.wuerfe.chance + '%' },
    auftanken:    { label: 'Auftanken',    unit: 'Nörten',           big: (a) => '+' + bigNum(a, '') }
  };
  const WURF = { einfach: '1 Wurf', mehrfach: 'Mehrfach', zufall: 'Zufällige Anzahl', kette: 'Kette' };
  const WURF_TXT = { einfach: 'ein Wurf entscheidet', mehrfach: 'jeder Wurf einzeln, Wert je Erfolg', zufall: 'erst Anzahl würfeln (von–bis), dann jeden Wurf', kette: 'weiter bis zum ersten Fehlwurf, Wert steigt pro Glied' };
  const WANN = { immer: 'immer', erfolg: 'bei Erfolg', fehlschlag: 'bei Fehlschlag' };
  const ZIEL = { selbst: 'selbst', gegner: 'Gegner' };
  const PFAD_ART = { lp_faktor: 'LP-Faktor +', noerten_faktor: 'Nörten-Faktor +', tempo: 'Tempo +', lernt: 'Neue Aktion', verbessern: 'Aktion verbessern', optik: 'Optik (Rahmen, Titel)' };
  const FELD = { chance: 'Chance (%)', wert: 'Wert / Schaden', kosten: 'Kosten', n: 'Anzahl Würfe', effekt: 'Effekt-Stärke' };

  // Vorlagen aus dem Baustein-Katalog
  const W = (chance, art = 'einfach', more = {}) => ({ art, chance, ...more });
  const O = (...p) => p.map(([wert, anteil]) => ({ anteil: anteil ?? 100, wert }));
  const E = (wann, ziel, art, wert, runden = 1) => ({ wann, ziel, art, wert, runden });
  const VORLAGEN = {
    angriff: [
      ['Einfach', { kosten: 15, wuerfe: W(85), ausgaenge: O([14]) }],
      ['Mehrfach (3 × 6)', { kosten: 20, wuerfe: W(65, 'mehrfach', { n: 3 }), ausgaenge: O([6]) }],
      ['Zufällige Anzahl (2–4 ×)', { kosten: 25, wuerfe: W(75, 'zufall', { n: 2, bis: 4 }), ausgaenge: O([6]) }],
      ['Kette (bis 5 ×, steigend)', { kosten: 20, wuerfe: W(70, 'kette', { n: 5, steigerung: 2 }), ausgaenge: O([4]) }],
      ['Glücksrad', { kosten: 30, wuerfe: W(60), ausgaenge: O([20, 60], [30, 30], [45, 10]) }],
      ['Kritisch (15 % × 2)', { kosten: 20, wuerfe: W(75), ausgaenge: O([16, 85], [32, 15]) }],
      ['Gift (Nachschaden)', { kosten: 25, wuerfe: W(75), ausgaenge: O([15]), effekte: [E('erfolg', 'gegner', 'gift', 5, 2)] }],
      ['Verunsichern', { kosten: 15, wuerfe: W(90), ausgaenge: O([8]), effekte: [E('erfolg', 'gegner', 'chance', -15)] }],
      ['Verstärken (kein Schaden)', { kosten: 15, wuerfe: W(100), ausgaenge: O([0]), effekte: [E('immer', 'selbst', 'schaden', 50)] }],
      ['Lebensraub', { kosten: 15, wuerfe: W(85), ausgaenge: O([12]), sonder: { lebensraub: 50 } }],
      ['Durchschlag', { kosten: 20, wuerfe: W(80), ausgaenge: O([14]), sonder: { durchschlag: 50 } }],
      ['Unausweichlich', { kosten: 12, wuerfe: W(100), ausgaenge: O([8]), sonder: { unausweichlich: true } }],
      ['Zuerst dran', { kosten: 10, wuerfe: W(95), ausgaenge: O([8]), sonder: { zuerst: true } }],
      ['Rückstoß', { kosten: 25, wuerfe: W(80), ausgaenge: O([32]), sonder: { rueckstoss: 8 } }],
      ['Nörten-Klau', { kosten: 15, wuerfe: W(85), ausgaenge: O([6]), effekte: [E('erfolg', 'gegner', 'noerten', -10), E('erfolg', 'selbst', 'noerten', 10)] }]
    ],
    verteidigung: [
      ['Sicherer Block', { kosten: 5, wuerfe: W(85), ausgaenge: O([40]) }],
      ['Riskanter Block', { kosten: 10, wuerfe: W(35), ausgaenge: O([90]), effekte: [E('erfolg', 'gegner', 'noerten', -10)] }],
      ['Schild-Punkte', { kosten: 8, wuerfe: W(90), ausgaenge: O([15]), sonder: { schild: true } }],
      ['Stufen-Block (Glücksrad)', { kosten: 5, wuerfe: W(100), ausgaenge: O([25, 50], [50, 40], [100, 10]) }],
      ['Dauerschutz', { kosten: 10, wuerfe: W(100), ausgaenge: O([25]), effekte: [E('immer', 'selbst', 'schutz', 20, 2)] }],
      ['Provozieren', { kosten: 5, wuerfe: W(80), ausgaenge: O([30]), effekte: [E('immer', 'gegner', 'chance', -15)] }]
    ],
    ausweichen: [
      ['Tempo-Duell', { kosten: 10, wuerfe: W(50) }],
      ['Feste Chance', { kosten: 10, wuerfe: W(45), sonder: { fest: true } }],
      ['Halb und halb', { kosten: 8, wuerfe: W(40), sonder: { fest: true, halb: true } }],
      ['Mit Gegenschlag', { kosten: 12, wuerfe: W(35), sonder: { gegenschlag: 12 } }],
      ['Rückenwind', { kosten: 10, wuerfe: W(50), effekte: [E('erfolg', 'selbst', 'chance', 15)] }]
    ],
    auftanken: [
      ['Sicher', { kosten: 0, wuerfe: W(100), ausgaenge: O([25]) }],
      ['Glücksschluck', { kosten: 0, wuerfe: W(100), ausgaenge: O([32, 80], [0, 20]) }],
      ['Schluck für Schluck', { kosten: 0, wuerfe: W(75, 'mehrfach', { n: 4 }), ausgaenge: O([8]) }],
      ['Langsam (über Runden)', { kosten: 0, wuerfe: W(100), ausgaenge: O([12]), effekte: [E('immer', 'selbst', 'tank', 10, 2)] }],
      ['Stärken (+ LP)', { kosten: 0, wuerfe: W(100), ausgaenge: O([12]), sonder: { lp: 12 } }],
      ['Rausch', { kosten: 0, wuerfe: W(100), ausgaenge: O([60]), effekte: [E('immer', 'selbst', 'chance', -20)] }],
      ['Mut antrinken', { kosten: 0, wuerfe: W(100), ausgaenge: O([15]), effekte: [E('immer', 'selbst', 'schaden', 25)] }]
    ]
  };

  let figs = [], base = null, saved = null, data = null, versions = null;
  let tab = ls.get(TAB) || 'figuren', sel = null, selAct = null;
  if (!['figuren', 'pfad', 'balance', 'regeln', 'versionen'].includes(tab)) tab = 'figuren';
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const dirty = () => JSON.stringify(data) !== JSON.stringify(saved);
  const fileName = (id) => (figs.find((f) => f.id === id) || {}).name || id;
  const figName = (id) => (data.typen[id] && data.typen[id].name) || fileName(id);
  const num = (v, d = 0) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : d; };
  const fmt = (n, d = 1) => Number(n).toLocaleString('de-DE', { maximumFractionDigits: d, minimumFractionDigits: 0 });
  const need = (c) => K.need(K.step5(c));
  const T = () => data.typen[sel];
  const norm = (a) => K.aktionBauen(a, []);
  function bigNum(a0, pre, post = '') {
    const a = norm(a0), o = a.ausgaenge, v = o.length > 1 ? `${Math.min(...o.map((x) => x.wert))}–${Math.max(...o.map((x) => x.wert))}` : o[0].wert;
    const n = a.wuerfe.art === 'mehrfach' ? `${a.wuerfe.n}×` : a.wuerfe.art === 'zufall' ? `${a.wuerfe.n}–${a.wuerfe.bis}×` : a.wuerfe.art === 'kette' ? `≤${a.wuerfe.n}×` : '';
    return pre + n + v + post;
  }
  function sub(a0) {
    const a = norm(a0), p = [];
    p.push(a.kat === 'ausweichen' ? (a.sonder.fest ? 'feste Chance' : '± Tempo') : a.wuerfe.chance >= 100 ? 'sicher' : `${a.wuerfe.chance} %`);
    if (a.ausgaenge.length > 1) p.push('Glücksrad');
    if (a.wuerfe.art === 'kette') p.push('Kette');

  function refreshCalc() {
    const t = T(); if (!t) return;
    const a0 = t.aktionen.find((a) => a.id === selAct); if (!a0) return;
    const a = norm(a0), e = K.erwartung(a0), k = a.kat;
    const d = $('#d20'); if (d) d.innerHTML = Array.from({ length: 20 }, (_, i) => `<span class="${i + 1 >= K.need(a.wuerfe.chance) ? 'ok' : ''}">${i + 1}</span>`).join('');
    const st = $('#stack');
    if (st) { const tot = a.ausgaenge.reduce((x, o) => x + Math.max(0, o.anteil), 0) || 1, C = ['#FFE08A', '#BFE8CF', '#C9D8FB', '#F7C6C7', '#E2D6FB'];
      st.innerHTML = a.ausgaenge.map((o, j) => `<div style="flex:${Math.max(0.001, o.anteil)};background:${C[j % 5]}">${Math.round(Math.max(0, o.anteil) / tot * 100)} %: ${o.wert}</div>`).join(''); }
    const unit = k === 'angriff' ? 'Schaden' : k === 'auftanken' ? 'Nörten' : '';
    let rows;
    if (k === 'ausweichen') rows = [[`${a.wuerfe.chance} %`, a.sonder.fest ? 'feste Chance' : 'bei gleichem Tempo'], [a.kosten, 'Nörten-Kosten'], [a.sonder.gegenschlag || '–', 'Gegenschlag']];
    else if (k === 'verteidigung') rows = [[a.sonder.schild ? fmt(e.ev) : `${fmt(e.ev, 0)} %`, a.sonder.schild ? 'Ø geschluckt' : 'Ø Schutz'], [`${fmt((1 - (1 - a.wuerfe.chance / 100)) * 100, 0)} %`, 'Abwehr greift'], [a.kosten, 'Nörten-Kosten']];
    else rows = [[fmt(e.ev), `Ø ${unit}`], [fmt(e.max, 0), `max. ${unit}`], [`${fmt(e.nichts * 100, 0)} %`, 'gar nichts'], ...(k === 'angriff' ? [[e.proNoerti == null ? '–' : fmt(e.proNoerti, 2), 'Schaden je Nörti']] : [])];
    $('#sum').innerHTML = rows.map((r) => `<div><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('');
    const fx = (a.effekte || []).map((x) => K.fxText(x)).filter(Boolean);
    $('#pcard').innerHTML = `<div class="pcard c-${k}"><div class="big">${esc(KAT[k].big(a0))}</div><div class="info"><b>${esc(a.name)}</b>${a.wuerfe.chance < 100 ? mini20(a.wuerfe.chance) : ''}<span class="small muted">${esc(sub(a0))}${fx.length ? ' · ' + esc(fx.join(', ')) : ''}</span></div></div>`;

    const no = $('[data-hint="no"]'); if (no) no.textContent = `bei „Normal“: ${Math.round(standardWert('kampf_noerten') * (t.noerten_faktor ?? 1))} Nörten`;
  }

  // ---------- Tab: Level-Pfad ----------
  function renderPfad() {
    const ids = allIds().filter((id) => data.typen[id]);
    if (!sel || !ids.includes(sel)) sel = ids[0];
    const t = T();
    if (!t) { $('#root').innerHTML = '<p class="card">Noch keine Figur mit Kampfwerten.</p>'; return; }
    t.pfad ||= {};
    const later = t.aktionen.filter((a) => !a.start);
    const warn = [];
    later.forEach((a) => { if (!lerntAb(t, a.id)) warn.push(`„${a.name}“ wird nie gelernt.`); });
    for (const [l, opts] of Object.entries(t.pfad)) opts.forEach((o) => {
      if ((o.art === 'lernt' || (o.art === 'verbessern' && o.aktion)) && !t.aktionen.some((a) => a.id === o.aktion)) warn.push(`Level ${l}: Aktion „${o.aktion}“ gibt es nicht mehr.`);
    });
    for (let l = 2; l <= 20; l++) if (!(t.pfad[l] || []).length) warn.push(`Level ${l} bringt nichts.`);
    // Endstand mit jeweils erster Option
    const w0 = {}; for (const [l, o] of Object.entries(t.pfad)) if (o.length > 1) w0[l] = 0;
    let end = null; try { end = K.figur(data, { type_id: sel, level: 20, wahlen: w0, name: '' }); } catch {}
    const aktOpts = (cur, only) => t.aktionen.filter((a) => !only || !a.start).map((a) => `<option value="${esc(a.id)}" ${a.id === cur ? 'selected' : ''}>${esc(a.name)} (${KAT[a.kat].label})</option>`).join('');
    const optHtml = (l, o, j, n) => {
      const q = `typen.${sel}.pfad.${l}.${j}`;
      let fields = '';
      if (['lp_faktor', 'noerten_faktor', 'tempo'].includes(o.art)) fields = `<input class="in" data-p="${q}.wert" data-num type="number" step="${o.art === 'tempo' ? 1 : 0.05}" value="${o.wert}" aria-label="Wert">`;
      else if (o.art === 'lernt') fields = `<select class="in" data-p="${q}.aktion" aria-label="Aktion">${aktOpts(o.aktion, true)}</select>`;
      else if (o.art === 'verbessern') {
        const ziel = o.aktion ? 'a:' + o.aktion : 'k:' + (o.kat || 'angriff');
        fields = `<select class="in" data-ziel="${q}" aria-label="Was">${t.aktionen.map((a) => `<option value="a:${esc(a.id)}" ${ziel === 'a:' + a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}${K.KAT.map((k) => `<option value="k:${k}" ${ziel === 'k:' + k ? 'selected' : ''}>alle ${KAT[k].label}</option>`).join('')}</select>
          <div class="row" style="flex-wrap:nowrap"><select class="in" data-p="${q}.feld" aria-label="Feld">${Object.entries(FELD).map(([x, lab]) => `<option value="${x}" ${x === o.feld ? 'selected' : ''}>${lab}</option>`).join('')}</select>
          <input class="in" data-p="${q}.wert" data-num type="number" value="${o.wert}" aria-label="Wert" style="max-width:80px"></div>`;
      } else if (o.art === 'optik') fields = `<input class="in" data-p="${q}.text" value="${esc(o.text || '')}" maxlength="40" aria-label="Text">`;
      return `<div class="opt"><div class="oh"><span>${n > 1 ? 'OPTION ' + String.fromCharCode(65 + j) : 'FEST'}</span><button class="x mini" data-act="delOpt" data-l="${l}" data-j="${j}" aria-label="Option entfernen" style="min-height:28px;padding:0 8px">×</button></div>
        <select class="in" data-part="${q}" aria-label="Art">${Object.entries(PFAD_ART).map(([x, lab]) => `<option value="${x}" ${x === o.art ? 'selected' : ''}>${lab}</option>`).join('')}</select>
        ${fields}<span class="txt">${esc(K.optionText(t, o))}</span></div>`;
    };
    let rows = '';

  async function runSim() {
    const ids = Object.keys(data.typen).sort(), lv = +$('#simLv').value, n = +$('#simN').value, opts = { lp: +$('#simLp').value, noerten: +$('#simNo').value };
    const out = $('#simOut'), d = clone(data); d.format = K.FORMAT;
    const rnd = (t) => { const w = {}; for (const [l, o] of Object.entries(d.typen[t].pfad || {})) if (+l <= lv && o.length > 1) w[l] = Math.floor(Math.random() * o.length); return w; };
    const wins = {}, rounds = {}; let errors = 0, done = 0; const total = ids.length * (ids.length - 1) * n;
    for (const a of ids) for (const b of ids) {
      if (a === b) continue;
      let w = 0, r = 0;
      for (let i = 0; i < n; i++) {
        try {
          const s = K.neu(d, { name: 'A', figs: [{ type_id: a, level: lv, wahlen: rnd(a), name: 'a' }] }, { name: 'B', figs: [{ type_id: b, level: lv, wahlen: rnd(b), name: 'b' }] }, opts);
          while (!s.over) K.runde(s, K.zufall(s, 'A'), K.zufall(s, 'B'));
          w += s.winner === 'A' ? 1 : s.winner ? 0 : 0.5; r += s.runde - 1;
        } catch (e) { errors++; }
        if (++done % 400 === 0) { out.innerHTML = `<p class="small muted">Rechne … ${Math.round(done / total * 100)} %</p>`; await new Promise((res) => setTimeout(res, 0)); }
      }
      wins[a + b] = w / n; rounds[a + b] = r / n;
    }
    const color = (p) => `background:hsl(${Math.round(p * 120)} 65% 85%)`;
    const avg = (a) => { const o = ids.filter((b) => b !== a); return o.reduce((x, b) => x + (wins[a + b] + 1 - wins[b + a]) / 2, 0) / o.length; };
    const html = `<div class="scroll" style="margin-top:6px"><table class="heat"><thead><tr><th>Level ${lv} · Zeile gewinnt gegen Spalte</th>${ids.map((b) => `<th class="n">${esc(figName(b))}</th>`).join('')}<th class="n">Ø</th></tr></thead><tbody>
      ${ids.map((a) => `<tr><td><b>${esc(figName(a))}</b></td>${ids.map((b) => a === b ? '<td class="n muted">–</td>' : `<td class="n" style="${color(wins[a + b])}">${Math.round(wins[a + b] * 100)} %</td>`).join('')}<td class="n" style="${color(avg(a))}">${Math.round(avg(a) * 100)} %</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin:6px 0 0">Ø ${fmt(Object.values(rounds).reduce((x, y) => x + y, 0) / Object.values(rounds).length)} Runden pro Kampf${errors ? ` · <span class="eff-low">${errors} Kämpfe mit Fehler – Werte prüfen</span>` : ''}. Ziel: alle Ø-Werte zwischen 40 und 60 %.</p>`;
    sim = { lv, html }; out.innerHTML = html;
  }

  function problems() {
    const out = [];
    for (const [id, t] of Object.entries(data.typen)) {
      const n = figName(id);
      if (!(t.lp_faktor > 0)) out.push(`${n}: LP-Faktor fehlt`);
      if (!(t.noerten_faktor > 0)) out.push(`${n}: Nörten-Faktor fehlt`);
      if (!(t.tempo >= 1 && t.tempo <= 10)) out.push(`${n}: Tempo muss 1–10 sein`);
      for (const k of K.KAT) {
        const st = t.aktionen.filter((a) => a.kat === k && a.start).length;
        if (k === 'angriff' && !st) out.push(`${n}: braucht einen Angriff ab Start`);
        if (k === 'auftanken' && !t.aktionen.some((a) => a.kat === k && a.start && !(a.kosten > 0))) out.push(`${n}: braucht ein kostenloses Auftanken ab Start (sonst kann man festhängen)`);
        if (st > K.MAX_PRO_KAT) out.push(`${n}: mehr als ${K.MAX_PRO_KAT} ${KAT[k].label}-Aktionen ab Start`);
      }
      t.aktionen.forEach((a) => {
        const w = a.wuerfe || {};
        if (!String(a.name || '').trim()) out.push(`${n}: Aktion ohne Namen`);
        if (w.chance % 5 || w.chance < 5 || w.chance > 100) out.push(`${n} / ${a.name}: Chance in 5er-Schritten (5–100)`);
        if (w.art && w.art !== 'einfach' && !(w.n >= 1 && w.n <= 8)) out.push(`${n} / ${a.name}: 1–8 Würfe`);
        if (w.art === 'zufall' && !(w.bis >= w.n)) out.push(`${n} / ${a.name}: „bis“ muss mindestens „von“ sein`);
        if (a.kat !== 'ausweichen' && !((a.ausgaenge || []).reduce((x, o) => x + (o.anteil > 0 ? o.anteil : 0), 0) > 0)) out.push(`${n} / ${a.name}: Ausgänge brauchen einen Anteil`);
        if (a.kat === 'verteidigung' && !(a.sonder || {}).schild && (a.ausgaenge || []).some((o) => o.wert > 100)) out.push(`${n} / ${a.name}: Reduktion höchstens 100 %`);
        (a.effekte || []).forEach((x) => { if (!K.FX[x.art]) out.push(`${n} / ${a.name}: unbekannter Effekt`); });
      });
      for (const [l, opts] of Object.entries(t.pfad || {})) opts.forEach((o) => {
        if (o.aktion && !t.aktionen.some((a) => a.id === o.aktion)) out.push(`${n}: Level ${l} verweist auf eine gelöschte Aktion`);
      });
      if (Object.values(t.pfad || {}).some((o) => o.length > 5)) out.push(`${n}: höchstens 5 Optionen pro Level`);
    }
    return out;
  }
  $('#discard').onclick = () => { if (confirm('Alle ungespeicherten Änderungen verwerfen?')) { data = clone(base.stale ? base.data : saved); render(); } };
  $('#save').onclick = () => {
    const errs = problems();
    if (errs.length) { N.sheet(`<h2>Noch nicht ganz</h2><ul style="margin:0;padding-left:20px">${errs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul><button class="btn" data-close>OK</button>`, (el) => el.querySelector('[data-close]').onclick = N.closeSheet); return; }
    data.format = K.FORMAT;
    const pin = ls.get(PIN_STORE) || '';
    const el = N.sheet(`<h2>Speichern</h2>
      <p>Die neue Version gilt sofort für alle Kämpfe. Alte Versionen bleiben unter „Versionen“ erhalten.</p>
      <p class="small muted">Hast du im Level-Pfad Optionen umsortiert oder entfernt, zeigen bereits getroffene Wahlen danach evtl. auf eine andere Option. Dann im Tag-Writer die Wahlen der Figur zurücksetzen.</p>
      <label class="field">Notiz (optional)<input id="note" maxlength="120" placeholder="z. B. Skater schneller"></label>
      <label class="field" ${pin ? 'hidden' : ''}>Admin-PIN<input id="pinIn" type="password" inputmode="numeric" autocomplete="off"></label>
      <button class="btn-main" id="go">Version ${base.version + 1} speichern</button>
      ${pin ? '<button class="btn-text" id="forget">Andere PIN verwenden</button>' : ''}`);
    const forget = el.querySelector('#forget');
    if (forget) forget.onclick = () => { ls.set(PIN_STORE, null); N.closeSheet(); $('#save').click(); };
    el.querySelector('#go').onclick = async (ev) => {
      const p = pin || el.querySelector('#pinIn').value.trim();
      if (!p) { N.toast('Bitte PIN eingeben', 'err'); return; }
      ev.target.disabled = true;
      try {
        const note = el.querySelector('#note').value.trim();
        const r = await N.api.saveGameData(data, p, base.version, note);
        ls.set(PIN_STORE, p);
        base = { version: r.version, data: clone(data), note: note || null, created_at: new Date().toISOString() };
        saved = clone(data); N.closeSheet(); setStatus(); render(); N.toast(`Version ${r.version} gespeichert ✓`);
      } catch (e) {
        ev.target.disabled = false;
        const m = N.errMsg(e);
        if (/PIN/.test(m)) ls.set(PIN_STORE, null);
        N.toast(/function|schema cache/i.test(m) ? 'SQL-Nachtrag 004 fehlt noch in Supabase' : m, 'err');
      }
    };
  };
  window.addEventListener('beforeunload', (e) => { if (data && dirty()) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- Start ----------
  (async () => {
    try {
      // Namen direkt aus figuren.json (N.types() enthält schon die Namen aus dem Editor)
      [figs, base] = await Promise.all([fetch(N.ROOT + 'figuren.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => d.figuren || []), N.gameData()]);
      saved = clone(base.data); data = clone(base.data);
      if (base.stale) saved = { stale: true };        // alte DB-Version: Startwerte gelten als ungespeichert
      const d = ls.get(DRAFT);
      if (d) {
        try { const j = JSON.parse(d); if (j.base === base.version && j.data && j.data.format >= 2) { data = j.data; N.toast('Entwurf wiederhergestellt'); } else ls.set(DRAFT, null); } catch { ls.set(DRAFT, null); }
      }
      setStatus(); render();
    } catch (e) {
      $('#root').innerHTML = `<p class="card">Spieldaten konnten nicht geladen werden: ${esc(N.errMsg(e))}</p>`;
    }
  })();
})();
</script>
</body>
</html>
